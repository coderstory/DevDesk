name: CI

# dev 分支每次提交：双平台（macOS + Windows）构建 + 测试
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

env:
  # EUI-NEO 用的是修改版 fork（比上游多 90+ 提交）；上游缺 setScrollOffset /
  # TextRun / chromeless 等 API，直接编译不过
  EUI_NEO_REPO: https://github.com/coderstory/EUI-NEO.git

jobs:
  macos:
    name: macOS · 构建 + 测试
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: DevDesk

      - name: 取 EUI-NEO（须与 DevDesk 同级目录）
        run: git clone --depth 1 "$EUI_NEO_REPO" EUI-NEO

      - name: 安装依赖
        run: brew install ninja openssl@3

      - name: 构建 + 测试
        working-directory: DevDesk
        run: |
          set +e
          bash scripts/build-test-run.sh --release --no-run 2>&1 | tee /tmp/ci.log
          rc=${PIPESTATUS[0]}

          if [ "$rc" -eq 0 ]; then
            echo "::notice::构建与测试全绿"
            exit 0
          fi

          # macOS 上有 3 条已知的平台不对称红：FileWatcher 在 macOS 走轮询兜底（测试
          # 依赖原生 watcher 的即时回调）、keychain 空账号语义与 Windows DPAPI 不同。
          # 这里只容忍这三条 —— 多出任何一条都算回归，CI 该红就红。
          known=$(grep -c '^\[FAIL\]' /tmp/ci.log)
          unexpected=$(grep '^\[FAIL\]' /tmp/ci.log \
            | grep -vcE 'MD-01 (conflict toast reload path triple hit|capture race after blocks shrink)|反向同步③ 缺席即清空' || true)

          echo "失败用例数：$known，其中非预期：$unexpected"
          if [ "$unexpected" -eq 0 ] && [ "$known" -gt 0 ]; then
            echo "::warning::仅命中 3 条已知的 macOS 平台不对称红，视为通过"
            exit 0
          fi
          echo "::error::出现非预期的测试失败"
          exit 1

  windows:
    name: Windows · 构建 + 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: DevDesk

      - name: 取 EUI-NEO（须与 DevDesk 同级目录）
        run: git clone --depth 1 "$env:EUI_NEO_REPO" EUI-NEO

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl

      - name: 构建 + 测试
        shell: msys2 {0}
        run: |
          cd DevDesk
          bash scripts/build-test-run.sh --release --no-run
