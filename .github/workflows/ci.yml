name: CI

# dev 分支每次提交：双平台（macOS + Windows）构建 + 测试
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

env:
  # EUI-NEO 用的是修改版 fork（比上游多 90+ 提交）；上游缺 setScrollOffset /
  # TextRun / chromeless 等 API，直接编译不过
  EUI_NEO_REPO: https://github.com/coderstory/EUI-NEO.git
  # ccache 放在工作区下，方便 actions/cache 直接命中；BASEDIR 让不同 worktree
  # 路径哈希一致 —— 不设 BASEDIR 等于白装缓存
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G
  # 让构建输出实时刷到 CI 日志（默认被脚本吞掉，看起来像卡死）
  DEVDESK_BUILD_VERBOSE: "1"

jobs:
  macos:
    name: macOS · 构建 + 测试
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          path: DevDesk

      - name: 取 EUI-NEO（须与 DevDesk 同级目录）
        run: git clone --depth 1 "$EUI_NEO_REPO" EUI-NEO

      - name: 切到镜像上最新的 Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -switch "$latest"; fi
          echo "--- 工具链 ---"
          xcodebuild -version
          clang --version | head -1
          echo "架构: $(uname -m)　系统: $(sw_vers -productVersion)"

      - name: 安装依赖
        run: brew install ninja ccache openssl@3

      - name: ccache 缓存
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - name: 构建 + 测试
        working-directory: DevDesk
        run: |
          set +e
          bash scripts/build-test-run.sh --release --no-run 2>&1 | tee /tmp/ci.log
          rc=${PIPESTATUS[0]}

          # ccache 命中率（诊断用；0% 说明缓存没接上）
          ccache -s 2>/dev/null | grep -E "Hits|Misses|hit rate|Cache size" || true

          if [ "$rc" -eq 0 ]; then
            echo "::notice::构建与测试全绿"
            exit 0
          fi

          # macOS 上有 3 条已知的平台不对称红：FileWatcher 在 macOS 走轮询兜底（测试
          # 依赖原生 watcher 的即时回调）、keychain 空账号语义与 Windows DPAPI 不同。
          # 这里只容忍这三条 —— 多出任何一条都算回归，CI 该红就红。
          known=$(grep -c '^\[FAIL\]' /tmp/ci.log)
          unexpected=$(grep '^\[FAIL\]' /tmp/ci.log \
            | grep -vcE 'MD-01 (conflict toast reload path triple hit|capture race after blocks shrink)|反向同步③ 缺席即清空' || true)

          # 注意：变量一律写 ${VAR} 花括号 —— runner 上是 bash 3.2，$VAR 紧跟全角
          # 标点（：，、）会把后续字节并进变量名，展开成空串（实测踩过：
          # 「失败用例数：」后面一片空白，就是 $known 被吞了）
          echo "失败用例数：${known}　其中非预期：${unexpected}"
          if [ "${unexpected}" -eq 0 ] && [ "${known}" -gt 0 ]; then
            echo "✅ 视为通过 —— 仅命中 ${known} 条已知的 macOS 平台不对称红："
            grep '^\[FAIL\]' /tmp/ci.log | sed 's/^/     /'
            echo "   （FileWatcher 在 macOS 走轮询兜底 / keychain 空账号语义与 DPAPI 不同，"
            echo "    三条都在基线里长期存在，见仓库 CLAUDE.md）"
            echo "::warning::${known} 条已知平台不对称红被容忍，其余全部通过"
            exit 0
          fi
          echo "❌ 出现非预期的测试失败"
          echo "::error::出现非预期的测试失败"
          exit 1

  windows:
    name: Windows · 构建 + 测试
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          path: DevDesk

      - name: 取 EUI-NEO（须与 DevDesk 同级目录）
        run: git clone --depth 1 "$env:EUI_NEO_REPO" EUI-NEO

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl

      - name: ccache 缓存
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: 构建 + 测试
        shell: msys2 {0}
        run: |
          cd DevDesk
          bash scripts/build-test-run.sh --release --no-run
          echo "--- ccache ---"
          ccache -s 2>/dev/null | grep -E "Hits|Misses|hit rate|Cache size" || true
