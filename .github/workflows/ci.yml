name: CI

# dev 分支每次提交：双平台（macOS + Windows）构建 + 测试
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

env:
  # EUI-NEO 用的是修改版 fork（比上游多百余个提交，计数随开发持续增长、不在此
  # 写死）；上游缺 setScrollOffset / TextRun / chromeless 等 API，直接编译不过。
  # 消费政策：不锁版本、每次用最新源码，取框架步骤 --depth 1 拉 fork HEAD 即
  # 政策本身（见 docs/adr/0006 与 scripts/check-eui-neo-version.sh）
  EUI_NEO_REPO: https://github.com/coderstory/EUI-NEO.git
  # ccache 放在工作区下，方便 actions/cache 直接命中；BASEDIR 让不同 worktree
  # 路径哈希一致 —— 不设 BASEDIR 等于白装缓存
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G
  # 让构建输出实时刷到 CI 日志（默认被脚本吞掉，看起来像卡死）
  DEVDESK_BUILD_VERBOSE: "1"
  # CI 不编 probe 二进制（2026-10-03）：runner 无 GUI 会话，14 个 UI probe 测试
  # 全走 SKIP_RETURN_CODE 77 跳过，12 个 probe 可执行的编译链接是纯浪费。
  # 0 → build-test-run.sh 传 -DDEVDESK_BUILD_PROBES=OFF（probe 目标与 ctest
  # 注册整体不生成，probe 门禁段与探针跳过登记守卫显式跳过打 ⏭）。
  # 单测全量与静态守卫照跑；probe 真门禁靠本地（默认 ON）+ headless 断言单测。
  DEVDESK_BUILD_PROBES: "0"

jobs:
  macos:
    name: macOS · 构建 + 测试
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          path: DevDesk

      - name: 取 EUI-NEO（须与 DevDesk 同级目录）
        run: git clone --depth 1 "$EUI_NEO_REPO" EUI-NEO

      - name: 切到镜像上最新的 Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # 过滤掉 beta/RC：官方策略里 beta 只装在最新镜像上且与 GA 并存，
          # 直接 sort -V 取最大可能选中 beta，导致制品由非 GA 工具链产出
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null \
                   | grep -viE 'beta|release candidate|_rc' | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -switch "$latest"; fi
          echo "--- 工具链 ---"
          xcodebuild -version
          clang --version | head -1
          echo "架构: $(uname -m)　系统: $(sw_vers -productVersion)"

      - name: 安装依赖
        run: brew install ninja ccache openssl@3

      - name: ccache 缓存
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - name: 构建 + 测试
        working-directory: DevDesk
        run: |
          set +e
          bash scripts/build-test-run.sh --release --no-run 2>&1 | tee /tmp/ci.log
          rc=${PIPESTATUS[0]}
          # ccache 命中率（诊断用；0% 说明缓存没接上）
          ccache -s 2>/dev/null | grep -E "Hits|Misses|hit rate|Cache size" || true
          exit "${rc}"

      - name: 测试日志（失败时留档，便于定位）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-log
          path: /tmp/ci.log
          if-no-files-found: ignore

      # ── ASan/UBSan（07 号票，计划 T5）─────────────────────────────────────
      # AppleClang 一等支持 sanitizer：独立目录 build-san/ 再来一遍 Debug 构建，
      # 全量单测在 sanitizer 下跑绿才算过。flags 靠 CXXFLAGS/LDFLAGS 环境变量注入 ——
      # build-test-run.sh 的 configure 不显式传 -DCMAKE_CXX_FLAGS/-DCMAKE_EXE_LINKER_FLAGS，
      # CMake 只在**首次 configure** 时从这两个环境变量取初值；build-san 每次都在全新
      # runner 上首建、必走首建 configure，注入是确定的。链接端 flag 必须经 LDFLAGS 单独
      # 落 CMAKE_EXE_LINKER_FLAGS —— 只给编译端 flag 链接不进 ASan/UBSan runtime，等于白编。
      # -fno-omit-frame-pointer：留帧指针让 ASan 栈回溯可读；-fno-sanitize-recover=undefined：
      # UBSan 违例直接置红 —— 默认 recover 只打印不失败，会造出「违例刷屏但门禁绿」的假绿。
      # 只跑本目录单测（脚本 RUN_TEST 段即 devdesk_tests 全量）；probe 仍不编：工作区级
      # DEVDESK_BUILD_PROBES=0 对本 step 同样生效（probe 目标不生成、门禁段显式打 ⏭）——
      # probe 是真开窗 UI 用例，sanitizer 下无意义且 runner 无 GUI 会话。
      # **Windows 位后置**：MinGW 的 ASan 运行时不稳（计划 T5 原话），勿照搬到 windows job，
      # 防后人重复踩坑；决策记录另见 07 号票完成记录。
      - name: ASan/UBSan 构建 + 全量单测
        working-directory: DevDesk
        run: |
          set +e
          CXXFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
          LDFLAGS="-fsanitize=address,undefined" \
          DEVDESK_BUILD_DIR=build-san \
          bash scripts/build-test-run.sh --no-run 2>&1 | tee /tmp/ci-san.log
          rc=${PIPESTATUS[0]}
          # ccache 命中率（诊断用；累计数含上一构建步，sanitizer flags 不同 → 缓存键不同 →
          # 与 Release 构建互不命中，首跑必然全 miss）
          ccache -s 2>/dev/null | grep -E "Hits|Misses|hit rate|Cache size" || true
          exit "${rc}"

      - name: ASan/UBSan 日志（失败时留档，便于定位）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-sanitizer-log
          path: /tmp/ci-san.log
          if-no-files-found: ignore

  windows:
    name: Windows · 构建 + 测试
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          path: DevDesk

      - name: 取 EUI-NEO（须与 DevDesk 同级目录）
        run: git clone --depth 1 "$env:EUI_NEO_REPO" EUI-NEO

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl

      - name: ccache 缓存
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: 构建 + 测试
        shell: msys2 {0}
        run: |
          cd DevDesk
          bash scripts/build-test-run.sh --release --no-run
          echo "--- ccache ---"
          ccache -s 2>/dev/null | grep -E "Hits|Misses|hit rate|Cache size" || true

      # clang-tidy 报告模式（05 号票，计划 T5）：runner（windows-2025 镜像）预装 LLVM
      # 于 C:\Program Files\LLVM\bin，读 compile_commands.json 扫 bugprone-*/cert-*/*
      # clang-analyzer-*，只报告不阻断 —— **存量清零后转 blocking，见 06 号票**。
      # 与本地复现命令 scripts/run-clang-tidy.sh 同源（configure 与 tidy 调用都在脚本里，
      # configure 与上方 build-test-run.sh 同参数，仅多 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON，
      # 落独立目录 build-tidy/ 不污染正常构建），脚本内探测 clang-tidy 并 echo 版本留痕。
      # shell 与上方构建 step 保持一致走 msys2（cmake/ninja 来自 setup-msys2）；
      # continue-on-error: true = 报告模式语义：本步失败不阻断 job、不影响合入信号。
      - name: clang-tidy（报告模式，非阻塞）
        continue-on-error: true
        shell: msys2 {0}
        run: |
          cd DevDesk
          bash scripts/run-clang-tidy.sh
