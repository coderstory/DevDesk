  ov.appendChild(tip);},3300);
 setTimeout(()=>{ov.classList.remove("show");ov.innerHTML="";},5800);
}

  map:{H:"#c0392b",A:"#e74c3c",O:"#a93226",K:"#111"}},
];
// 休息活动池：snack吃零食 / phone玩手机 / game打游戏 / aunt姨妈·大姨夫请假(被驳回彩蛋) / slk摸鱼被抓包彩蛋
const ACTS=[
 {k:"snack",e:"🍿",say:"摸鱼吃零食，真香"},
 {k:"phone",e:"📱",say:"刷手机中…别@我"},
 {k:"game",e:"🕹️",say:"再来一局！"},
 {k:"aunt",e:"🩹",say:"请假条：今天姨妈/大姨夫上门",deny:"驳回！回工位！"},
 {k:"slk",e:"😏",say:"摸鱼中…（彦祖已盯上，点我抓包）"},
 {k:"snow",e:"🤤",say:"手机全是雪花…「内存不足」！口水流短路冒烟了 💨"},
];
function render(c){
 const px=document.createElement("div");px.className="px"+(c.big?" big":"");
 px.style.gridTemplateColumns="repeat(12,"+(c.big?8:6)+"px)";
 for(const row of c.art){for(const ch of row){const d=document.createElement("div");
   const col=ch==="."?"transparent":(c.map&&c.map[ch])||PAL[ch]||"transparent";
   d.style.background=col;px.appendChild(d);}}
 const el=document.createElement("div");el.className="char";el.style.left=c.x+"px";el.style.top=c.y+"px";el.dataset.id=c.id;
 if(c.work&&c.anim==="type")px.classList.add("anim-type");
 if(c.work&&c.anim==="palette")px.classList.add("palettehand");
 if(c.work&&c.anim==="flip")px.classList.add("flipper");
 el.appendChild(px);
 if(c.work&&c.anim==="spark"){const s1=document.createElement("div");s1.className="spark";s1.style.left="48px";s1.style.top="6px";
   const s2=document.createElement("div");s2.className="spark s2";s2.style.left="60px";s2.style.top="16px";el.append(s1,s2);}
 if(c.work&&c.anim==="whip"){const w=document.createElement("div");w.className="whipstick";w.style.cssText+="position:absolute;left:66px;top:10px;width:3px;height:22px;background:#5a3a26";el.appendChild(w);}
 const tag=document.createElement("div");tag.className="name "+(c.work?"work":"idle");tag.textContent=c.name;el.appendChild(tag);
 if(c.work){const b=document.createElement("div");b.className="bubble";b.textContent=c.note||c.work||"";el.appendChild(b);}
 else{
  if(!c.act)c.act=ACTS[Math.floor(Math.random()*ACTS.length)];
  const emo=document.createElement("div");emo.className="egg";emo.style.cssText="position:static;margin-bottom:2px;font-size:14px";emo.textContent=c.act.e;el.prepend(emo);
  if(c.act.k==="snow"){const sm=document.createElement("div");sm.className="egg";sm.style.cssText="position:absolute;left:44px;top:-4px;font-size:12px";sm.textContent="💨";el.appendChild(sm);}
  const b=document.createElement("div");b.className="bubble";b.textContent=c.act.say;el.appendChild(b);
  if(c.act.deny){const d=document.createElement("div");d.className="bubble";d.style.background="#e74c3c";d.style.color="#fff";
   d.style.bottom="calc(100% + 34px)";d.textContent=c.act.deny+"（老板批）";el.appendChild(d);}
 }
 el.onclick=()=>{c.work=!c.work;c.act=null;refresh(c.id);};
 return el;
}
function refresh(id){const c=CHARS.find(x=>x.id===id);document.querySelector(`.char[data-id="${id}"]`).replaceWith(render(c));}
document.getElementById("chars").append(...CHARS.map(render));
// —— 真实数据通道：启动时拉 status.json（与定时任务约定），拉不到回落内置演示数据 ——
// status.json 契约（coderstory 定时任务每几分钟覆写一次）：
// { "updated": "2026-10-29T18:00:00", "members": [ {"id":"boss","work":false,"act":"snack"}, ... ] }
// id 取值：boss/cpo/witch/coder/qa/ui/rsh/rev；work=true 干活(工位) / false 待命(休息区)；
// act 可选：snack/phone/game/aunt/slk/snow（只对 work=false 生效，缺省随机）。
const dataTag=document.createElement("div");dataTag.className="sub";document.querySelector(".legend").appendChild(dataTag);
async function loadStatus(){
 // 兼容两种契约：① {updated, members:[{id,work,act}]} ② [{name,status:"working"|"idle",note}]
 const NAME2ID=[["老板","boss"],["老炮儿","cpo"],["魔女","witch"],["直男","coder"],["恶魔","qa"],["蟑螂","ui"],["老妖怪","rsh"],["辣椒","rev"]];
 try{
  const r=await fetch("./status.json",{cache:"no-store"});
  if(!r.ok)throw 0;
  const j=await r.json();
  const list=Array.isArray(j)?j:(j.members||[]);
  let hit=0;
  for(const m of list){
   let c=null,work,act=null,note=null;
   if(m.id){c=CHARS.find(x=>x.id===m.id);work=!!m.work;act=m.act||null;}
   else{const key=(m.name||"");const id=(NAME2ID.find(p=>key.includes(p[0]))||[])[1];
        c=id&&CHARS.find(x=>x.id===id);work=m.status==="working";note=m.note||null;}
   if(!c)continue;
   c.work=work;c.act=act?(ACTS.find(a=>a.k===act)||null):null;c.note=note;hit++;
  }
  dataTag.textContent="数据源：status.json（"+(Array.isArray(j)?"":(j.updated||"")+" · ")+"命中 "+hit+"/8）";
 }catch(e){dataTag.textContent="数据源：内置演示数据（status.json 未就绪）";}
 const box=document.getElementById("chars");box.innerHTML="";box.append(...CHARS.map(render));
}
function manualToggle(id){/* 点击仍可手动切，下次轮询会以 status.json 为准 */}
loadStatus();setInterval(loadStatus,30000);
</script>
