<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终端页 UI 重设计 v2 · 视觉校准 demo（need241）</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  demo 仅视觉校准，不是实现蓝图。
  设计权威：docs/design/2026-11-05-终端页面UI重设计.md（参数以文档为准）
  覆盖三关键态（全部可交互到达）：
    ① 多 TAB 运行中（初始态：终端1/2 Running 绿点，终端3 Exited 灰点+覆盖卡）
    ② 单 TAB 空态（把 TAB 逐个关闭：Idle 空网格光标态 / 0 TAB 空态引导）
    ③ 全屏态（点 ⛶ 进入：侧栏 0 宽全隐不画 logo——clue92 终裁；进/退同槽 32×32
       纯图标钮 expand⇄compress 只切图标，无胶囊无文字）
  自适应：拖窗缩放验证——页面区 <720px 新建收图标钮、TAB 溢出横滚+渐隐遮罩。
  浅色主题；暗色 token 对照见设计文档 §11。无外部依赖，双击直开。
  ═══════════════════════════════════════════════════════════════════
-->
<style>
  /* ── token（浅色档，theme.cpp 实值）── */
  :root {
    --background: #F5FAF7;      /* 页面底 */
    --card-fill: rgba(255,255,255,0.94);  /* 容器卡 glassFill α0.94 */
    --surface: #FFFFFF;         /* 网格底/TAB激活底 实色 */
    --surface-elevated: #FFFFFF;/* 浮层卡底（暗色档 #2C2A28 见文档） */
    --border: #E5E7EB;          /* borderDefault */
    --hover: #EEF6F1;
    --soft: #E8F8EE;            /* primarySoftBg */
    --text-1: #1F2937;
    --text-2: #4B5563;
    --text-3: #6B7280;
    --primary: #07C160;
    --primary-hover: #06AD56;
    --primary-pressed: #059048;
    --on-primary: #FFFFFF;
    --primary-text: #157E4E;
    --error: #EF4444;
    --error-text: #B91C1C;
    --sidebar-bg: #EBF6EF;
    --secondary-btn: #F2F2F2;
    --edge-dark: rgba(0,0,0,0.35);  /* 浮层细黑边 */
    --shadow-card: rgba(16,54,38,0.09);
    --mono: "Cascadia Mono", "JetBrains Mono", Consolas, Menlo, "Courier New", monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: "Inter","Microsoft YaHei","PingFang SC",sans-serif;
    background:#DDD; color:var(--text-1);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    user-select:none;
  }
  /* ── 窗壳 ── */
  #app {
    width:100%; height:100%; min-width:560px; min-height:420px;
    background:var(--background);
    display:flex; flex-direction:column;
    box-shadow:0 0 0 1px rgba(0,0,0,1.0);  /* window ring 1px 细黑边 */
  }
  /* ── 标题栏 40px ── */
  .titlebar {
    height:40px; flex:0 0 40px;
    display:flex; align-items:center; padding:0 16px;
    background:var(--card-fill);
  }
  .titlebar .brand { font-size:14px; font-weight:700; color:var(--text-1); }
  .titlebar .win-btns { margin-left:auto; display:flex; }
  .titlebar .win-btn {
    width:46px; height:40px; display:flex; align-items:center; justify-content:center;
    color:var(--text-2); background:transparent; border:none; cursor:default;
  }
  .titlebar .win-btn.close:hover { background:var(--error); color:#fff; }
  .titlebar .win-btn.min:hover { background:var(--hover); }
  .body-row { flex:1; display:flex; min-height:0; }

  /* ── 侧栏 220/72 ── */
  .sidebar {
    width:220px; flex:0 0 220px;           /* 全屏折叠 72（瞬时，无动画=设计口径） */
    background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; position:relative;
  }
  .brand-block { height:56px; flex:0 0 56px; display:flex; align-items:center; justify-content:center; }
  .logo {
    width:48px; height:48px; border-radius:10px; background:var(--primary);
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-family:var(--mono); font-size:17px; font-weight:700; letter-spacing:-1px;
  }
  .nav-wrap { flex:1; position:relative; min-height:0; }
  .nav { height:100%; overflow-y:auto; padding:4px 12px 8px; scrollbar-width:none; }
  .nav::-webkit-scrollbar { display:none; }   /* bug188：滚动条视觉全无 */
  .nav-item {
    height:40px; display:flex; align-items:center; gap:0;
    padding:0 12px; border-radius:6px; color:var(--text-2); font-size:15px;
    position:relative; cursor:default;
  }
  .nav-item:hover { background:var(--hover); }
  .nav-item.active { background:var(--surface); color:var(--primary-text); font-weight:600; }
  .nav-item.active::before {           /* 左 2px 绿竖线，退到导航项底色外留白 */
    content:""; position:absolute; left:-10px; top:11px; width:3px; height:18px;
    border-radius:2px; background:var(--primary);
  }
  .nav-item svg { flex:0 0 28px; }
  .nav-item .lbl { margin-left:10px; white-space:nowrap; }
  .nav-divider { height:1px; background:var(--border); margin:4px 12px; }
  /* 侧栏渐隐遮罩 16px（bug188：滚动不可见的「还有内容」信号） */
  .nav-fade {
    position:absolute; left:0; right:0; height:16px; z-index:2;
    opacity:0; transition:opacity .15s cubic-bezier(0.215,0.61,0.355,1); pointer-events:none;
  }
  .nav-fade.top { top:0; background:linear-gradient(var(--sidebar-bg), rgba(235,246,239,0)); }
  .nav-fade.bottom { bottom:0; background:linear-gradient(rgba(235,246,239,0), var(--sidebar-bg)); }
  .nav-fade.show { opacity:1; }
  .collapse-btn {
    margin:8px 12px 12px; height:32px; width:32px; border-radius:16px;
    border:1px solid var(--border); background:transparent; color:var(--text-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:all .15s cubic-bezier(0.215,0.61,0.355,1);
  }
  .collapse-btn:hover { background:var(--soft); border-color:var(--primary-hover); color:var(--primary); transform:scale(1.04); }
  .collapse-btn:active { transform:scale(.96); }

  /* ── 页面区（容器卡：一张卡两段式）── */
  .page {
    flex:1; min-width:0; display:flex; flex-direction:column;
    background:var(--card-fill);                          /* 层1 外容器卡 */
  }
  /* ── TAB 栏带 44px ── */
  .tabbar {
    height:44px; flex:0 0 44px; display:flex; align-items:center;
    padding:0 12px 0 8px; border-bottom:1px solid var(--border);
  }
  .tabs-wrap { flex:1; min-width:0; position:relative; height:100%; }
  .tabs {
    height:100%; display:flex; align-items:center; gap:4px;
    overflow-x:auto; scrollbar-width:none; padding:6px 0;
  }
  .tabs::-webkit-scrollbar { display:none; }  /* TAB 区横滚无滚动条视觉 */
  .tabs-fade {
    position:absolute; top:0; bottom:0; width:16px; z-index:2; pointer-events:none;
    opacity:0; transition:opacity .15s cubic-bezier(0.215,0.61,0.355,1);
  }
  .tabs-fade.left { left:0; background:linear-gradient(90deg, #fff, rgba(255,255,255,0)); }
  .tabs-fade.right { right:0; background:linear-gradient(270deg, #fff, rgba(255,255,255,0)); }
  .tabs-fade.show { opacity:1; }

  /* ── TAB 项 ── */
  .tab {
    height:32px; min-width:120px; max-width:200px;
    display:flex; align-items:center; padding:0 12px;
    border-radius:6px; border:1px solid transparent;
    color:var(--text-2); font-size:14px; cursor:default; position:relative;
    flex:0 1 auto; overflow:hidden;
    transition:background .12s cubic-bezier(0.215,0.61,0.355,1),
               color .12s cubic-bezier(0.215,0.61,0.355,1),
               border-color .12s cubic-bezier(0.215,0.61,0.355,1),
               width .2s cubic-bezier(0.215,0.61,0.355,1),
               opacity .15s ease-out;
  }
  .tab:hover { background:var(--hover); color:var(--text-1); }
  .tab:active { background:var(--soft); color:var(--text-1); }
  .tab.active { background:var(--surface); border-color:var(--border); color:var(--text-1); }
  .tab.active::after {                 /* 激活：底部 2px 绿条（骑分割线） */
    content:""; position:absolute; left:8px; right:8px; bottom:-1px; height:2px;
    border-radius:1px; background:var(--primary);
  }
  .tab.closing { width:0 !important; min-width:0; padding:0; border:0; opacity:0; }
  .dot { width:8px; height:8px; border-radius:4px; flex:0 0 8px; }
  .dot.running { background:var(--primary); }
  .dot.idle { background:transparent; border:1px solid var(--text-3); }
  .dot.exited { background:var(--text-3); }
  .dot.failed { background:var(--error); }
  .tab .title { margin:0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; text-align:left; }
  .tab-close {
    width:16px; height:16px; flex:0 0 16px; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-3); background:transparent; border:none; cursor:pointer;
    padding:0; opacity:1; transition:opacity .12s cubic-bezier(0.215,0.61,0.355,1), background .1s, color .1s;
  }
  .tab:not(.active):not(:hover) .tab-close { opacity:0; pointer-events:none; } /* 非激活 hover 才显 */
  .tab-close:hover { background:rgba(239,68,68,0.10); color:var(--error-text); }
  .tab-close:active { background:rgba(239,68,68,0.18); }

  /* ── 动作组（顺序写死：分隔线→设置→全屏/退出→新建）── */
  .divider-v { width:1px; height:20px; background:var(--border); margin:0 8px; flex:0 0 1px; }
  .icon-btn {
    width:32px; height:32px; border-radius:6px; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; color:var(--text-2);
    cursor:pointer; flex:0 0 32px;
    transition:all .1s cubic-bezier(0.215,0.61,0.355,1), transform .18s cubic-bezier(0.34,1.56,0.64,1);
  }
  .icon-btn:hover { background:var(--hover); color:var(--text-1); }
  .icon-btn:active { background:var(--soft); color:var(--text-1); transform:scale(.96); }
  .primary-btn {
    height:32px; padding:0 12px; margin-left:8px; border:none; border-radius:6px;
    background:var(--primary); color:var(--on-primary); font-size:14px;
    display:flex; align-items:center; gap:6px; cursor:pointer; flex:0 0 auto;
    transition:background .1s, transform .1s cubic-bezier(0.215,0.61,0.355,1);
  }
  .primary-btn:hover { background:var(--primary-hover); }
  .primary-btn:active { background:var(--primary-pressed); transform:scale(.96); }

  /* ── 全屏态（clue92 终裁：侧栏 0 宽全隐不画 logo；同槽图标钮只切图标） ── */
  #app.fullscreen .sidebar { display:none; }          /* 0 宽全隐，非折叠 72 */
  /* 同槽 32×32 图标钮：expand ⇄ compress 直切，无交叉淡化 */
  #btnFullscreen .ic-compress { display:none; }
  #app.fullscreen #btnFullscreen .ic-expand  { display:none; }
  #app.fullscreen #btnFullscreen .ic-compress { display:block; }

  /* ── 终端网格区（层2b 实色，唯一内滚）── */
  .grid-area { flex:1; min-height:0; position:relative; background:var(--surface); overflow:hidden; }
  .term {
    position:absolute; inset:0; overflow-y:auto; scrollbar-width:none;
    padding:8px 12px; font-family:var(--mono); font-size:13px; line-height:16.25px;
    color:var(--text-1); white-space:pre; user-select:text; cursor:text;
  }
  .term::-webkit-scrollbar { display:none; }
  .term .dim { color:var(--text-3); }
  .term .grn { color:var(--primary-text); }
  .term .red { color:var(--error-text); }
  .caret { display:inline-block; width:7px; height:14px; background:var(--text-1); vertical-align:-2px; animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* ── 覆盖卡（Exited/Failed 浮层）── */
  .scrim {
    position:absolute; inset:0; background:rgba(0,0,0,0.35); z-index:5;
    display:none; align-items:center; justify-content:center;
  }
  .scrim.show { display:flex; }
  .overlay-card {
    width:360px; height:148px; background:var(--surface-elevated);
    border:1px solid var(--edge-dark); border-radius:14px;
    box-shadow:0 4px 24px var(--shadow-card);
    padding:16px; display:flex; flex-direction:column;
    animation:overlayIn .2s cubic-bezier(0.215,0.61,0.355,1);
  }
  @keyframes overlayIn { from { opacity:0; transform:translateY(8px); } }
  .ov-head { display:flex; align-items:center; gap:8px; font-size:15px; color:var(--text-1); font-weight:600; }
  .ov-detail { margin-top:6px; font-size:12px; color:var(--text-2); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ov-actions { margin-top:auto; display:flex; gap:8px; justify-content:flex-end; }
  .btn-main {
    height:28px; padding:0 12px; border:none; border-radius:6px;
    background:var(--primary); color:var(--on-primary); font-size:13px; cursor:pointer;
    transition:background .1s, transform .1s;
  }
  .btn-main:hover { background:var(--primary-hover); }
  .btn-main:active { background:var(--primary-pressed); transform:scale(.96); }
  .btn-sub {
    height:28px; padding:0 12px; border:none; border-radius:6px;
    background:var(--secondary-btn); color:var(--text-1); font-size:13px; cursor:pointer;
    transition:background .1s, transform .1s;
  }
  .btn-sub:hover { background:#E5E5E5; }
  .btn-sub:active { transform:scale(.96); }

  /* ── 空态 ── */
  .empty {
    position:absolute; inset:0; z-index:4; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:0;
    color:var(--text-2); font-size:14px;
  }
  .empty.show { display:flex; }
  .empty .glyph { color:var(--text-3); margin-bottom:8px; }
  .empty .link { margin-top:12px; background:none; border:none; color:var(--primary-text);
    font-size:14px; cursor:pointer; padding:4px 8px; border-radius:6px; }
  .empty .link:hover { background:var(--soft); }
  .empty .link:active { transform:scale(.96); }

  /* ── 窄窗收缩（页面区 <720px）── */
  #app.compact .primary-btn .lbl { display:none; }
  #app.compact .primary-btn { width:32px; padding:0; justify-content:center; }
  #app.compact .tab { min-width:100px; }

  /* svg 图标基线 */
  svg.ic { display:block; }
</style>
</head>
<body>
<div id="app">
  <!-- 标题栏 -->
  <div class="titlebar">
    <span class="brand">DevDesk</span>
    <div class="win-btns">
      <button class="win-btn min" title="最小化"><svg class="ic" width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="win-btn close" title="关闭"><svg class="ic" width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>

  <div class="body-row">
    <!-- 侧栏（bug165/188 校准面） -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-block"><div class="logo">&gt;_</div></div>
      <div class="nav-wrap">
        <div class="nav-fade top" id="navFadeTop"></div>
        <nav class="nav" id="nav">
          <div class="nav-item"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 7.5 6 3.5 2 -0.5" transform="translate(0,4.5)"/><line x1="8" y1="12.5" x2="14" y2="12.5"/></svg><span class="lbl">首页</span></div>
          <div class="nav-item"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><line x1="5.5" y1="8" x2="10.5" y2="8"/></svg><span class="lbl">Markdown 笔记本</span></div>
          <div class="nav-item"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.5 8.5 7.5 10.5 11 6.5"/></svg><span class="lbl">Todo 看板</span></div>
          <div class="nav-item"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2.2 1.6"/></svg><span class="lbl">定时调度</span></div>
          <div class="nav-item"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg><span class="lbl">Claude 切换器</span></div>
          <div class="nav-item"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="8" cy="8" rx="5.5" ry="3" transform="rotate(-30 8 8)"/><ellipse cx="8" cy="8" rx="5.5" ry="3" transform="rotate(30 8 8)"/></svg><span class="lbl">记忆</span></div>
          <div class="nav-item active"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/><path d="M5 8.5 6.5 7 5 5.5M8 9.5h3"/></svg><span class="lbl">终端</span></div>
          <div class="nav-item"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5v13M1.5 8h13M3.5 3.5l9 9M12.5 3.5l-9 9" opacity="0"/><path d="M2 12 8 2l6 10zM6 12l2-4 2 4"/></svg><span class="lbl">上线</span></div>
          <div class="nav-divider"></div>
          <div class="nav-item"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4"/></svg><span class="lbl">设置</span></div>
          <div class="nav-item"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.8"/><line x1="8" y1="10.5" x2="8" y2="10.6"/><circle cx="8" cy="5.5" r="0.8" fill="currentColor" stroke="none"/></svg><span class="lbl">关于</span></div>
        </nav>
        <div class="nav-fade bottom" id="navFadeBottom"></div>
      </div>
      <button class="collapse-btn" id="btnCollapse" title="折叠/展开侧栏"><svg class="ic" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><line x1="2" y1="2.5" x2="10" y2="2.5"/><line x1="2" y1="6" x2="10" y2="6"/><line x1="2" y1="9.5" x2="10" y2="9.5"/></svg></button>
    </aside>

    <!-- 页面区：终端容器卡（一张卡两段式） -->
    <main class="page">
      <!-- TAB 栏带 44px：左 TAB 区 / 右动作组（顺序写死） -->
      <div class="tabbar">
        <div class="tabs-wrap">
          <div class="tabs-fade left" id="tabFadeL"></div>
          <div class="tabs" id="tabs"></div>
          <div class="tabs-fade right" id="tabFadeR"></div>
        </div>
        <div class="divider-v"></div>
        <button class="icon-btn" id="btnSettings" title="设置（入口预留）"><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2.2M8 12.3v2.2M1.5 8h2.2M12.3 8h2.2M3.4 3.4l1.6 1.6M11 11l1.6 1.6M12.6 3.4 11 5M5 11l-1.6 1.6"/></svg></button>
        <button class="icon-btn" id="btnFullscreen" title="进入全屏"><svg class="ic ic-expand" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg><svg class="ic ic-compress" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 6.5 2.5 2.5M6.5 2.8v3.7H2.8M9.5 9.5l4 4M9.5 13.2V9.5h3.7"/></svg></button>
        <button class="primary-btn pressable" id="btnNew"><svg class="ic" width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="6" y1="1.5" x2="6" y2="10.5"/><line x1="1.5" y1="6" x2="10.5" y2="6"/></svg><span class="lbl">新建</span></button>
      </div>

      <!-- 终端网格区 -->
      <div class="grid-area" id="gridArea">
        <div class="term" id="term"></div>
        <div class="empty" id="empty">
          <svg class="ic glyph" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 9l3 3-3 3M11.5 15H17"/></svg>
          <span>没有终端会话</span>
          <button class="link" id="btnEmptyNew">+ 新建会话</button>
        </div>
        <div class="scrim" id="scrim">
          <div class="overlay-card">
            <div class="ov-head"><span id="ovIcon"></span><span id="ovTitle">会话已结束，退出码 0</span></div>
            <div class="ov-detail" id="ovDetail">输出已保留，可重新开始或新建会话</div>
            <div class="ov-actions">
              <button class="btn-sub" id="ovClose">关闭标签</button>
              <button class="btn-main" id="ovRetry">重新开始</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
"use strict";
/* ── 状态（demo 内存态，非实现蓝图）── */
let seq = 0;
let tabs = [];             // {id,title,state: running|idle|exited|failed}
let activeId = null;
const $ = (id) => document.getElementById(id);
const app = $("app");

/* 初始 = 关键态①：多 TAB 运行中（含 1 个 Exited 展示覆盖卡） */
function makeTab(state) {
  seq += 1;
  return { id: seq, title: "终端 " + seq, state: state || "running" };
}
tabs = [makeTab("running"), makeTab("running"), makeTab("exited")];
activeId = tabs[0].id;

/* ── 图标 ── */
const XMARK = '<svg class="ic" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="1.5" y1="1.5" x2="8.5" y2="8.5"/><line x1="8.5" y1="1.5" x2="1.5" y2="8.5"/></svg>';
const WARN  = '<svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#EF4444" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><line x1="8" y1="4.5" x2="8" y2="9"/><circle cx="8" cy="11.2" r="0.9" fill="#EF4444" stroke="none"/></svg>';
const CHECK = '<svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#6B7280" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2 7.2 10.2 11 6.2"/></svg>';

/* ── 终端 mock 内容（CJK 2 格 + TUI 表格口径）── */
const TERM_RUN =
'<span class="dim">~ %</span> claude\n' +
'<span class="grn">●</span> Claude Code v2.x · 会话进行中\n\n' +
'  ┌──────────┬──────────────┐\n' +
'  │ 状态     │ 正常         │\n' +
'  │ 任务     │ 重构完成     │\n' +
'  │ 耗时     │ 3m 42s       │\n' +
'  └──────────┴──────────────┘\n\n' +
'<span class="dim">── 中文宽度校准行：状态|正常|OK · 全半角混排 1:1 ──</span>\n\n' +
'<span class="dim">~ %</span> <span class="caret"></span>';
const TERM_IDLE =
'<span class="dim">~ %</span> <span class="caret"></span>';
const TERM_EXIT =
'<span class="dim">~ %</span> echo done\ndone\n<span class="dim">[进程退出码 0 · 输出已保留]</span>\n\n<span class="dim">~ %</span> <span style="opacity:.4">▌</span>';
const TERM_FAIL =
'<span class="red">终端启动失败</span>\n<span class="dim">ConPTY 不可用（OS &lt; 1809 或后端缺失）</span>';

/* ── 渲染 ── */
function renderTabs() {
  const box = $("tabs");
  box.innerHTML = "";
  tabs.forEach((t) => {
    const el = document.createElement("div");
    el.className = "tab" + (t.id === activeId ? " active" : "");
    el.dataset.id = t.id;
    el.innerHTML =
      '<span class="dot ' + t.state + '"></span>' +
      '<span class="title">' + t.title + "</span>" +
      '<button class="tab-close" title="关闭会话">' + XMARK + "</button>";
    el.addEventListener("click", () => { activeId = t.id; renderAll(); });
    el.querySelector(".tab-close").addEventListener("click", (ev) => {
      ev.stopPropagation();
      closeTab(t.id);
    });
    box.appendChild(el);
  });
  renderBody();
}
function renderBody() {
  const t = tabs.find((x) => x.id === activeId);
  const term = $("term"), empty = $("empty"), scrim = $("scrim");
  if (!t) {                                    /* 0 TAB → 空态引导 */
    term.style.display = "none"; empty.classList.add("show"); scrim.classList.remove("show");
    return;
  }
  empty.classList.remove("show");
  if (t.state === "exited" || t.state === "failed") {
    term.style.display = "block";
    term.innerHTML = t.state === "exited" ? TERM_EXIT : TERM_FAIL;
    scrim.classList.add("show");
    $("ovIcon").innerHTML = t.state === "exited" ? CHECK : WARN;
    $("ovTitle").textContent = t.state === "exited" ? "会话已结束，退出码 0" : "终端启动失败";
    $("ovDetail").textContent = t.state === "exited"
      ? "输出已保留，可重新开始或新建会话"
      : "ConPTY 不可用：OS < 1809 或终端后端缺失（错误详情 ≤2 行截断）";
    $("ovRetry").textContent = t.state === "exited" ? "重新开始" : "重试";
  } else {
    scrim.classList.remove("show");
    term.style.display = "block";
    term.innerHTML = t.state === "running" ? TERM_RUN : TERM_IDLE;
  }
}
function renderAll() {
  renderTabs();
  updateFades();
}

/* ── 交互 ── */
function closeTab(id) {
  const idx = tabs.findIndex((x) => x.id === id);
  if (idx < 0) return;
  const el = $("tabs").children[idx];
  el.classList.add("closing");                 /* 150ms 淡出收窄 */
  setTimeout(() => {
    tabs.splice(idx, 1);
    if (activeId === id) {                     /* 右邻优先激活 */
      const next = tabs[Math.min(idx, tabs.length - 1)];
      activeId = next ? next.id : null;
    }
    renderAll();
  }, 150);
}
function newTab() {
  const t = makeTab("running");
  tabs.push(t);
  activeId = t.id;
  renderAll();
  const box = $("tabs");
  box.scrollLeft = box.scrollWidth;            /* 新 TAB 滚入视野 */
}
$("btnNew").addEventListener("click", newTab);
$("btnEmptyNew").addEventListener("click", newTab);
$("btnFullscreen").addEventListener("click", () => {
  /* 同槽图标钮：进/退全屏同一位，只切 expand⇄compress（clue92 终裁，无胶囊） */
  const on = app.classList.toggle("fullscreen");
  $("btnFullscreen").title = on ? "退出全屏" : "进入全屏";
});
$("btnCollapse").addEventListener("click", () => {
  /* demo：手动折叠/展开只在非全屏态演示（全屏态=侧栏 0 宽全隐不画 logo，设计 §4.6 终裁） */
  if (!app.classList.contains("fullscreen"))
    app.classList.toggle("sidebar-collapsed");
});
$("ovClose").addEventListener("click", () => activeId !== null && closeTab(activeId));
$("ovRetry").addEventListener("click", () => {
  const t = tabs.find((x) => x.id === activeId);
  if (t) { t.state = "running"; renderAll(); }
});

/* 侧栏折叠 demo 态（width 220→72 瞬时） */
const style = document.createElement("style");
style.textContent = "#app.sidebar-collapsed .sidebar{width:72px;flex-basis:72px}" +
  "#app.sidebar-collapsed .logo{width:40px;height:40px;font-size:14px}" +
  "#app.sidebar-collapsed .nav-item .lbl{display:none}" +
  "#app.sidebar-collapsed .nav-item{justify-content:center;padding:0}" +
  "#app.sidebar-collapsed .nav-item svg{flex:0 0 auto}" +
  "#app.sidebar-collapsed .nav-item.active::before{left:0}" +
  "#app.sidebar-collapsed .nav{padding:4px 8px 8px}" +
  "#app.sidebar-collapsed .nav-divider{margin:4px 16px}" +
  "#app.sidebar-collapsed .collapse-btn{align-self:center}";
document.head.appendChild(style);

/* ── 渐隐遮罩显隐（侧栏 + TAB 区）── */
function updateFades() {
  const nav = $("nav");
  $("navFadeTop").classList.toggle("show", nav.scrollTop > 2);
  $("navFadeBottom").classList.toggle("show", nav.scrollTop + nav.clientHeight < nav.scrollHeight - 2);
  const box = $("tabs");
  $("tabFadeL").classList.toggle("show", box.scrollLeft > 2);
  $("tabFadeR").classList.toggle("show", box.scrollLeft + box.clientWidth < box.scrollWidth - 2);
}
$("nav").addEventListener("scroll", updateFades);
$("tabs").addEventListener("scroll", updateFades);
window.addEventListener("resize", updateFades);

/* ── 窄窗收缩断点（页面区 <720px）── */
function responsive() {
  const pageW = document.querySelector(".page").clientWidth;
  app.classList.toggle("compact", pageW < 720);
  updateFades();
}
window.addEventListener("resize", responsive);

/* init */
renderAll();
responsive();
setTimeout(updateFades, 50);
</script>
</body>
</html>
