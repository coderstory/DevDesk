<!DOCTYPE html>
<html lang="zh-CN">
<!--
  need172 侧边栏收缩/展开按钮 demo：圆框 + 悬浮三态 + 弥漫绿粒子（v3 包络版）
  ── demo 仅视觉校准，不是实现蓝图 ──
  · 自包含单文件：无框架、无外部依赖、浏览器直开；图标用内联 SVG 代替
    （生产实现用 FA 码点：折叠 fa-bars 0xF0C9 / 展开 fa-angles-left 0xF100）。
  · 覆盖：hover/按压/回弹果冻、粒子迸发（错峰延迟+包络）、220↔72 两态、
    三档窗高（自动判定 H≥712 正常 / 680~712 紧凑 / <680 极紧）、折叠弥散降档、
    全屏 0 宽整块不出现、focus 环、深色主题、满行压力、包络 overlay、粒子计数器。
  · 参数来源：docs/design/2026-11-05-need172-侧栏收缩按钮圆框悬浮粒子.md
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>need172 侧栏收缩按钮：圆框·悬浮·弥漫绿粒子 demo</title>
<style>
  :root{
    --page-bg:#F7F7F7; --side-bg:#E8F0EC; --card:#FFFFFF;
    --line:#E5E5E5; --line2:#EDEDED;
    --t1:#1A1A1A; --t2:#666666; --t3:#999999;
    --primary:#07C160; --primary-hover:#06AD56; --soft:#E6FBF2;
    --shadow:0 2px 8px rgba(26,26,26,.10);
  }
  body.dark{
    --page-bg:#23272B; --side-bg:#2B3034; --card:#2F3438;
    --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.08);
    --t1:#E8E8E8; --t2:#A0A6AD; --t3:#6E7580;
    --primary:#07C160; --primary-hover:#06AD56; --soft:rgba(7,193,96,.18);
    --shadow:0 2px 8px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:var(--page-bg);color:var(--t1);min-width:1200px;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ── 控制条 ─────────────────────────────── */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);
  }
  .bar b{font-size:14px}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{
    border:0;background:transparent;color:var(--t2);padding:5px 12px;cursor:pointer;
    font:12px/1.4 inherit;
  }
  .seg button.on{background:var(--soft);color:var(--primary-hover);font-weight:600}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t2);cursor:pointer;user-select:none}
  .chk input{accent-color:var(--primary)}
  #readout{
    margin-left:auto;font:12px/1.6 Consolas,monospace;color:var(--t2);
    background:var(--page-bg);border:1px solid var(--line);border-radius:6px;
    padding:6px 12px;max-width:520px;
  }
  #readout .num{color:var(--primary-hover);font-weight:700}

  /* ── 窗口舞台 ───────────────────────────── */
  #stage{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px}
  #win{
    flex:1;min-height:0;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  #titlebar{
    flex:0 0 40px;display:flex;align-items:center;gap:8px;padding:0 14px;
    background:var(--side-bg);border-bottom:1px solid var(--line);
  }
  #titlebar .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
  #titlebar .name{font-size:12px;color:var(--t2);margin-left:6px}
  #content{flex:1;display:flex;min-height:0;position:relative}

  /* ── 侧栏 ─────────────────────────────── */
  #sidebar{
    position:relative;flex:0 0 auto;background:var(--side-bg);
    border-right:1px solid var(--line);overflow:hidden;
  }
  body.fullscreen #sidebar{display:none}  /* 全屏=0 宽全隐：按钮/粒子整块不出现 */
  #brand{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center}
  #logo{border-radius:50%;background:var(--primary);position:relative}
  #logo::after{ /* logo 内部简约纹样，仅视觉占位 */
    content:"";position:absolute;inset:32%;border-radius:50%;
    background:rgba(255,255,255,.85);
  }
  #nav{
    position:absolute;left:0;right:0;overflow-y:auto;scrollbar-width:none;
  }
  #nav::-webkit-scrollbar{display:none}   /* bug188：滚动保留、滚动条视觉隐藏 */
  .row{
    display:flex;align-items:center;gap:10px;height:40px;margin:0 16px 4px;
    border-radius:6px;padding:0 10px;color:var(--t2);cursor:default;user-select:none;
  }
  .row:hover{background:var(--line2)}
  .row .ic{
    width:16px;height:16px;border-radius:5px;background:var(--line);flex:0 0 auto;
    position:relative;
  }
  .row .ic::after{content:"";position:absolute;inset:5px;border-radius:2px;background:var(--t3)}
  .row .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
  #sidebar.folded .row .lb,#sidebar.folded .row{width:40px;padding:0;justify-content:center;margin:0 auto 4px}
  #sidebar.folded .row .lb{display:none}

  /* ── 底部按钮预留区 ─────────────────────── */
  #zone{position:absolute;left:0;right:0;bottom:0}   /* 高由 JS 按档设置 */

  /* 果冻圆框按钮（热区外扩 4px 与绘制解耦，同生产口径） */
  #hot{
    position:absolute;display:block;background:transparent;border:0;padding:4px;
    cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;
  }
  #btn{
    display:flex;align-items:center;justify-content:center;width:100%;height:100%;
    box-sizing:border-box;
    border-radius:50%;background:transparent;
    border:1px solid var(--line);           /* 圆框常显 */
    color:var(--t2);
    transform:scale(1);
    transition:transform 180ms cubic-bezier(.34,1.56,.64,1),   /* 移出回弹 OutBack */
               background-color 180ms ease,border-color 180ms ease,color 180ms ease,
               box-shadow 180ms ease;
  }
  #btn svg{display:block;fill:currentColor}
  #hot:hover #btn{
    background:var(--soft);border-color:var(--primary-hover);color:var(--primary);
    transform:scale(1.04);box-shadow:var(--shadow);          /* 悬浮：浮起阴影 */
    transition:transform 150ms cubic-bezier(.215,.61,.355,1),  /* 进入 OutCubic */
               background-color 150ms ease,border-color 150ms ease,color 150ms ease,
               box-shadow 150ms ease;
  }
  #hot.pressed #btn{
    background:var(--soft);border-color:var(--primary);color:var(--primary);
    transform:scale(.96);box-shadow:none;                    /* 按压贴回 */
  }
  #hot:focus-visible #btn{                                   /* focus 环（不染底不变图标色） */
    outline:1.5px solid var(--primary);outline-offset:-1.5px;
    border-color:var(--primary);
  }

  /* 粒子层：不裁剪——越界与否直接目视，由包络数学保证不溢出 */
  #particles{position:absolute;inset:0;pointer-events:none}
  .pt{position:absolute;border-radius:50%;display:none;will-change:transform,opacity}

  /* 包络调试 overlay */
  #overlay{position:absolute;inset:0;pointer-events:none;display:none}
  body.showenv #overlay{display:block}

  /* ── 页面区占位 ─────────────────────────── */
  #page{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
        color:var(--t3);font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
  <header class="bar">
    <b>need172 侧栏收缩按钮 demo</b>
    <div class="seg" id="segTier" title="窗高三档：正常 H≥712 / 紧凑 680~712 / 极紧 <680">
      <button data-t="auto" class="on">档位·自动</button>
      <button data-t="normal">正常</button>
      <button data-t="compact">紧凑</button>
      <button data-t="tight">极紧</button>
    </div>
    <div class="seg">
      <button id="btnFold">折叠 72</button>
      <button id="btnFull">全屏 0 宽</button>
    </div>
    <div class="seg">
      <button id="btnTheme">深色主题</button>
    </div>
    <label class="chk"><input type="checkbox" id="chkEnv">包络 overlay（验证不溢出/不重叠）</label>
    <label class="chk"><input type="checkbox" id="chkFull">满行压力（导航行贴满让位线）</label>
    <div id="readout">…</div>
  </header>

  <div id="stage">
    <div id="win">
      <div id="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="name">DevDesk（窗口可拖缩，档位随侧栏内容高自动判定）</span></div>
      <div id="content">
        <div id="sidebar">
          <div id="brand"><div id="logo"></div></div>
          <div id="nav"></div>
          <div id="zone">
            <svg id="overlay"></svg>
            <div id="particles"></div>
            <button id="hot" aria-label="收缩/展开侧栏">
              <span id="btn" style="display:flex">
                <svg id="icFold" width="14" height="14" viewBox="0 0 16 16"><path d="M9.4 3 4.8 7.6a.6.6 0 0 0 0 .8L9.4 13l1.1-1.1L6.3 8l4.2-4.2L9.4 3z"/></svg>
                <svg id="icBars" width="14" height="14" viewBox="0 0 16 16" style="display:none"><path d="M2 4h12v1.4H2V4zm0 3.3h12v1.4H2V7.3zm0 3.3h12V12H2v-1.4z"/></svg>
              </span>
            </button>
          </div>
        </div>
        <div id="page">页 面 区</div>
      </div>
    </div>
  </div>

<script>
"use strict";
/* ══════════ 参数表（与设计文档 §2/§5 逐值对应） ══════════ */
const P = {
  sideExpand: 220, sideFold: 72,
  brandH: 56, gapLet: 4,                      // 让位 gap 4
  tier: { //           S(钮径) zoneH logo itemH navTop
    normal: { S:32, zoneH:48, logo:48, itemH:40 },
    compact:{ S:28, zoneH:44, logo:44, itemH:40 },
    tight:  { S:28, zoneH:44, logo:40, itemH:36 },
  },
  // 粒子
  n:12, life:0.80, delayMax:0.08, pumpStop:0.88,
  ky:0.55,                                    // 垂直压缩
  spreadExpand:[14,26], spreadFold:[10,16],   // 弥散距离
  sizeMin:4, sizeMax:6, shrinkEnd:0.7, opacity0:0.75,
  envInset:3, envBuffer:0,                    // 包络 [3,W-3]×[foldLimit,H-3]
  colorLight:["#07C160","#34D399","#06AD56"],
  colorDark:["#07C160","#06AD56"],            // primary / primaryHover 双色
};
const MODULES=["工作台","Markdown","待办","日程","Claude 代理","智能体","记忆","MCP","发布","设置","关于"];
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const hash01=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};

/* ══════════ 状态 ══════════ */
const st={ folded:false, fullscreen:false, tierMode:"auto", pressure:false,
           H:0, W:P.sideExpand, tier:P.tier.normal, tierName:"normal",
           particleStart:null, hotArmed:true, pressed:false };

/* ══════════ 布局（档位判定与几何） ══════════ */
const sidebar=$("#sidebar"),nav=$("#nav"),zone=$("#zone"),hot=$("#hot"),btn=$("#btn"),
      logo=$("#logo"),overlay=$("#overlay"),particles=$("#particles"),
      icFold=$("#icFold"),icBars=$("#icBars"),readout=$("#readout");

function tierByH(H){
  if(H>=712)return["normal",P.tier.normal];
  if(H>=680)return["compact",P.tier.compact];
  return["tight",P.tier.tight];
}
function layout(){
  const box=$("#content").getBoundingClientRect();
  st.H=box.height;                          // 侧栏内容高（窗口内容区）
  const forced=["normal","compact","tight"].includes(st.tierMode);
  [st.tierName,st.tier]=forced?[st.tierMode,P.tier[st.tierMode]]:tierByH(st.H);
  st.W=st.folded?P.sideFold:P.sideExpand;
  sidebar.style.width=st.W+"px";
  const {S,zoneH,logo:lg,itemH}=st.tier;
  // 预留区与按钮
  zone.style.height=zoneH+"px";
  const toggleY=st.H-zoneH+8;               // 区顶+8 垂直居中
  const toggleX=st.folded?(st.W-S)/2:16;    // 折叠居中 / 展开对齐导航左缘
  hot.style.left=(toggleX-4)+"px";hot.style.top=(toggleY-4)+"px";
  hot.style.width=(S+8)+"px";hot.style.height=(S+8)+"px";
  btn.style.width=S+"px";btn.style.height=S+"px";
  // 品牌/导航
  logo.style.width=lg+"px";logo.style.height=lg+"px";
  const foldLimit=st.H-zoneH-P.gapLet;      // 让位线
  nav.style.top=P.brandH+"px";nav.style.height=Math.max(0,foldLimit-P.brandH)+"px";
  sidebar.classList.toggle("folded",st.folded);
  document.querySelectorAll(".row").forEach(r=>r.style.height=itemH+"px");
  buildNav(foldLimit,itemH);
  drawOverlay(toggleX,toggleY,S,zoneH,foldLimit);
  // 图标随态切换
  icFold.style.display=st.folded?"":"none";
  icBars.style.display=st.folded?"none":"";
  return{toggleX,toggleY,S,foldLimit,zoneH};
}
function buildNav(foldLimit,itemH){
  const navH=foldLimit-P.brandH,gap=4;
  const perRow=itemH+gap;
  const count=st.pressure?Math.max(MODULES.length,Math.floor((navH+gap)/perRow)):MODULES.length;
  if(nav.children.length!==count||+nav.dataset.itemH!==itemH){
    nav.dataset.itemH=itemH;nav.innerHTML="";
    for(let i=0;i<count;i++){
      const r=document.createElement("div");r.className="row";
      r.style.height=itemH+"px";
      r.innerHTML='<span class="ic"></span><span class="lb">'+(MODULES[i%MODULES.length]||("占位行 "+(i+1)))+'</span>';
      nav.appendChild(r);
    }
  }
}
/* 包络 overlay：让位线 + 包络矩形 + 预留区 */
function drawOverlay(tx,ty,S,zoneH,foldLimit){
  const e=P.envInset;
  overlay.setAttribute("viewBox",`0 0 ${st.W} ${st.H}`);
  overlay.innerHTML=
    `<rect x="0" y="${foldLimit}" width="${st.W}" height="${st.H-foldLimit}" fill="rgba(7,193,96,.06)"/>`+
    `<line x1="0" y1="${foldLimit}" x2="${st.W}" y2="${foldLimit}" stroke="#06AD56" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/>`+
    `<text x="6" y="${foldLimit-4}" font-size="10" fill="#06AD56">让位线 foldLimit=${foldLimit}px</text>`+
    `<rect x="${e}" y="${foldLimit}" width="${st.W-2*e}" height="${st.H-e-foldLimit}" fill="none" stroke="#06AD56" stroke-width="1" stroke-dasharray="2 3" opacity=".55"/>`+
    `<text x="6" y="${st.H-6}" font-size="10" fill="#06AD56" opacity=".8">粒子包络 [${e},W−${e}]×[foldLimit,H−${e}]</text>`;
}

/* ══════════ 粒子（设计文档 §5 逐条实现） ══════════ */
// 预建 12 颗池化元素（对应生产：≤12 个矩形元素一次性成本）
const pool=[];
for(let i=0;i<P.n;i++){
  const d=document.createElement("div");d.className="pt";particles.appendChild(d);pool.push(d);
}
// 迸发参数在发射沿冻结（mid-pump 切态不改变已发粒子轨迹/弥散档）
function makeBurst(){
  const r0=st.tier.S/2+2;                                  // 起点半径=钮半径+2
  const range=st.folded?P.spreadFold:P.spreadExpand;       // 折叠降档 10~16
  const dark=document.body.classList.contains("dark");
  return{r0,dark,pts:Array.from({length:P.n},(_,i)=>{
    const aDeg=i*30+(hash01(i*13+1)-0.5)*20;               // 30°均布+hash±10°
    return{
      a:aDeg*Math.PI/180,
      delay:hash01(i*23+7)*P.delayMax,                     // 每颗 hash 延迟 0~80ms
      spread:range[0]+(range[1]-range[0])*hash01(i*17+2),
      pr:(P.sizeMin/2)+(P.sizeMax-P.sizeMin)/2*hash01(i*19+3), // 半宽 2~3
      color:dark?P.colorDark[i%2]:P.colorLight[i%3],
    };
  })};
}
let rafId=null;
function pump(){
  const{toggleX,toggleY,S,foldLimit}=layout();
  const cx=toggleX+S/2,cy=toggleY+S/2;
  const t=(performance.now()-st.particleStart)/1000;
  const B=st.burst;let alive=0;
  for(let i=0;i<P.n;i++){
    const q=B.pts[i];const el=pool[i];
    if(t<=q.delay){el.style.display="none";continue;}      // 未起爆不建元素
    const tt=clamp((t-q.delay)/P.life,0,1);
    const eased=1-Math.pow(1-tt,3);                        // OutCubic
    const d=B.r0+q.spread*eased;
    let px=cx+Math.cos(q.a)*d;
    let py=cy+Math.sin(q.a)*d*P.ky;                        // 垂直压缩 0.55
    px=clamp(px,P.envInset,st.W-P.envInset);               // 包络兜底
    py=clamp(py,foldLimit,st.H-P.envInset);
    const size=q.pr*2*(1-(1-P.shrinkEnd)*eased);           // 末端缩放 ×0.7
    el.style.display="block";alive++;
    el.style.width=size+"px";el.style.height=size+"px";
    el.style.left=(px-size/2)+"px";el.style.top=(py-size/2)+"px";
    el.style.background=q.color;
    el.style.opacity=(P.opacity0*(1-eased)).toFixed(3);    // 0.75→0
  }
  if(t<P.pumpStop){rafId=requestAnimationFrame(pump);}      // 880ms 自止
  else{rafId=null;pool.forEach(e=>e.style.display="none");alive=0;}
  readoutUpdate(alive,t);
}
function readoutUpdate(alive,t){
  const S=st.tier.S,zh=st.tier.zoneH,r0=S/2+2;
  const range=st.folded?P.spreadFold:P.spreadExpand;
  readout.innerHTML=
    `档位 <span class="num">${st.tierName}</span>｜H=<span class="num">${Math.round(st.H)}</span> `+
    `W=<span class="num">${st.W}</span>｜钮 <span class="num">${S}</span> 区 <span class="num">${zh}</span> `+
    `r0=<span class="num">${r0}</span> 弥散 <span class="num">${range[0]}~${range[1]}</span> `+
    `Ky=<span class="num">${P.ky}</span><br>`+
    `粒子元素 <span class="num">${alive}</span>/12｜泵 ${rafId?"运行中":"停止"}｜`+
    `生命 t=${(t||0).toFixed(2)}s / 自止 0.88s`;
}

/* ══════════ 交互（进入沿一次迸发 / 移出不补发 / 果冻） ══════════ */
hot.addEventListener("mouseenter",()=>{
  if(!st.hotArmed)return;
  st.hotArmed=false;                        // 进入沿：一次
  st.burst=makeBurst();
  st.particleStart=performance.now();
  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(pump);
});
hot.addEventListener("mouseleave",()=>{
  st.hotArmed=true;                         // 移出再进可重触发；已发粒子自然走完
  st.pressed=false;hot.classList.remove("pressed");
});
hot.addEventListener("mousedown",()=>{st.pressed=true;hot.classList.add("pressed");});
window.addEventListener("mouseup",()=>{st.pressed=false;hot.classList.remove("pressed");});
hot.addEventListener("click",()=>{
  if(st.fullscreen)return;
  st.folded=!st.folded;                     // 220↔72 瞬时切换（全站无宽度动画档）
  layout();syncBar();
});

/* 控制条 */
function syncBar(){
  $("#btnFold").classList.toggle("on",st.folded&&!st.fullscreen);
  $("#btnFull").classList.toggle("on",st.fullscreen);
}
$("#btnFold").addEventListener("click",()=>{st.fullscreen=false;st.folded=!st.folded;layout();syncBar();});
$("#btnFull").addEventListener("click",()=>{st.fullscreen=!st.fullscreen;layout();syncBar();});
$("#btnTheme").addEventListener("click",e=>{document.body.classList.toggle("dark");
  e.target.classList.toggle("on");});
document.querySelectorAll("#segTier button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#segTier button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");st.tierMode=b.dataset.t;layout();
}));
$("#chkEnv").addEventListener("change",e=>document.body.classList.toggle("showenv",e.target.checked));
$("#chkFull").addEventListener("change",e=>{st.pressure=e.target.checked;layout();});
window.addEventListener("resize",layout);

layout();readoutUpdate(0,0);
</script>
</body>
</html>
