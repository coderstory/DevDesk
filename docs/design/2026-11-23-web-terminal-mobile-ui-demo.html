<!doctype html>
<!--
  网页终端移动端 UI demo（need#490）
  demo 仅视觉校准，不是实现蓝图；仅设计验证，非产品实现。
  单文件、零外部依赖、零网络请求。切换器与模拟开关只服务于设计走查，不属于产品界面。
  已对齐 PRD v4 与技术卡 v3：无手动密钥入口、独立深/浅双色板、长按 500ms 选择模式、粘贴双路径、断线两段式与尺寸钳制。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>网页终端移动端 UI demo（仅设计验证）</title>
<style>
:root{
  --bg:#F5FAF7; --surface:#FFFFFF; --hover:#EEF6F1; --active:#E2F0E8;
  --primary:#07C160; --primary-hover:#06AD56; --primary-pressed:#059048; --on-primary:#06251A;
  --primary-text:#157A4E;
  --text-1:#1F2937; --text-2:#4B5563; --text-3:#6B6D80;
  --border:#E5E7EB; --border-muted:#F3F4F6;
  --error:#EF4444; --error-text:#B91C1C; --warning:#F59E0B; --warning-text:#B45309;
  --success:#10B981; --success-text:#157E4E;
  --scrim:rgba(15,31,24,.48);
  --term-bg:#1A1816; --term-fg:#FAF9F5; --term-dim:#9A948A; --term-cursor:#36D399;
  --term-green:#36D399; --term-red:#F87171; --term-yellow:#FBBF24; --term-blue:#60A5FA;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;background:#E8EFEA;font-family:var(--sans);color:var(--text-1);-webkit-font-smoothing:antialiased}

/* ===== demo 切换器（不属于产品） ===== */
.switcher{width:252px;flex:0 0 252px;height:100vh;overflow-y:auto;background:#FFFFFF;border-right:1px solid var(--border);padding:16px 12px 32px}
.sw-title{font-size:15px;font-weight:600;color:var(--text-1)}
.sw-badge{margin-top:6px;font-size:11px;line-height:16px;color:var(--warning-text);background:rgba(245,158,11,.12);border-radius:8px;padding:8px}
.sw-toggles{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.tg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);cursor:pointer;padding:4px 0}
.tg input{width:16px;height:16px;accent-color:var(--primary)}
.sw-group{margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text-3)}
.sw-btn{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:4px;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent;font:13px/1.3 var(--sans);color:var(--text-2);text-align:left;cursor:pointer}
.sw-btn:hover{background:var(--hover)}
.sw-btn.on{background:var(--active);border-color:var(--border);color:var(--text-1);font-weight:600}
.sw-btn span{font-size:10px;color:var(--text-3);margin-left:8px;flex:0 0 auto}

/* ===== 舞台与设备 ===== */
.stage{flex:1;min-width:0;height:100vh;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:28px;gap:12px}
.device{width:375px;height:667px;flex:0 0 auto;background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(15,31,24,.18);position:relative;transition:width .2s,height .2s}
.device.land{width:667px;height:375px}
.device.desk{width:1000px;height:660px;border-radius:12px}
.safe-top,.safe-bottom{display:none;flex:0 0 auto;font-size:11px;color:var(--text-3);background:#E9EFEC;align-items:center;justify-content:center;letter-spacing:.03em}
.device.safe .safe-top{display:flex;height:47px}
.device.safe .safe-bottom{display:flex;height:34px}
.device.desk .safe-top,.device.desk .safe-bottom,.device.desk .fakekb{display:none!important}
.screen-host{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}
.fakekb{display:none;height:250px;flex:0 0 250px;background:#D6DEE7;padding:10px;font-size:13px;color:#5A6472}
.device.kb .fakekb{display:block}
.kbrow{display:flex;justify-content:center;gap:4px;margin-bottom:6px}
.kbrow span{flex:0 0 28px;height:32px;background:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.18);font-size:12px}
.kbrow.wide span{flex:1;max-width:44px;font-size:10px;color:#6B7280}
.stage-note{font-size:12px;color:var(--text-3);text-align:center;max-width:900px}

/* ===== 通用控件 ===== */
.btn{height:44px;border-radius:10px;border:0;font:600 15px var(--sans);display:inline-flex;align-items:center;justify-content:center;padding:0 16px;cursor:pointer;transition:transform .1s ease-out,background .15s ease-out}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:active{background:var(--primary-pressed)}
.btn.ghost{background:#F2F2F2;color:var(--text-1);font-weight:500}
.btn.ghost:active{background:var(--hover)}
.btn.danger{background:var(--error);color:#fff}
.btn.block{width:100%}
.btn:disabled{background:var(--border-muted);color:var(--text-3);transform:none;cursor:default}
.btn-text{border:0;background:transparent;color:var(--primary-text);font:500 13px var(--sans);height:44px;padding:0 8px;border-radius:10px;cursor:pointer}
.btn-text:active{background:var(--hover)}
.hint{font-size:12px;line-height:18px;color:var(--text-3);margin:8px 0 0}
.err-line{min-height:16px;font-size:12px;line-height:16px;color:var(--error-text);margin:8px 0 0}
.err-line.muted{color:var(--text-3)}
.banner{background:rgba(239,68,68,.10);color:var(--error-text);border-radius:10px;padding:12px;font-size:13px;line-height:19px;margin:0 0 16px}

/* ===== 认证页 ===== */
.auth{flex:1;min-height:0;overflow-y:auto;padding:0 16px 24px}
.auth-card{max-width:360px;margin:72px auto 0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px}
.device.land .auth-card{margin-top:24px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);margin-bottom:16px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.auth h1{font-size:24px;line-height:32px;margin:0 0 8px;font-weight:600;color:var(--text-1)}
.auth .sub{font-size:13px;line-height:20px;color:var(--text-2);margin:0 0 20px}
.otp{display:flex;gap:8px;margin:0}
.device.land .otp .cell{height:48px}
.otp .cell{flex:1;height:52px;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font:500 24px/1 var(--mono);color:var(--text-1);background:var(--surface)}
.otp .cell.focus{border:2px solid var(--primary)}
.otp.dis .cell{opacity:.45}
.otp.err .cell{border-color:var(--error)}
.field-label{display:block;font-size:13px;color:var(--text-2);margin:20px 0 8px}
.note-block{font-size:14px;line-height:22px;color:var(--text-2);margin:0 0 20px}

/* ===== 终端 ===== */
.term{flex:1;min-height:0;display:flex;flex-direction:column}
.topbar{height:48px;flex:0 0 48px;display:flex;align-items:center;padding:0 4px;background:var(--surface);border-bottom:1px solid var(--border-muted);position:relative}
.tabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;padding:0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:36px;border-radius:6px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--active);color:var(--text-1);font-weight:600;box-shadow:inset 0 -2px 0 var(--primary)}
.tab-x{position:relative;width:32px;height:32px;margin-right:-8px;border:0;background:transparent;color:var(--text-3);font-size:16px;line-height:1;border-radius:6px;cursor:pointer}
.tab-x::after{content:"";position:absolute;inset:-6px}
.tab-x:active{color:var(--error-text)}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;color:var(--text-1);cursor:pointer}
.iconbtn:active{background:var(--hover)}
.vdiv{width:1px;height:24px;background:var(--border);margin:0 4px;flex:0 0 1px}
.reconnect{height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(245,158,11,.12);font-size:12px;color:var(--warning-text)}
.reconnect button{border:0;background:transparent;color:var(--primary-text);font-size:12px;height:28px;padding:0 4px;cursor:pointer}
.canvas-wrap{flex:1;min-height:0;position:relative;display:flex}
.canvas{flex:1;min-width:0;overflow:auto;background:var(--term-bg);color:var(--term-fg);padding:8px;font:13px/1.4 var(--mono);-webkit-overflow-scrolling:touch}
.canvas pre{margin:0;white-space:pre;user-select:none;-webkit-user-select:none}
.canvas.selecting pre{user-select:text;-webkit-user-select:text}
.sel{background:rgba(54,211,153,.28)}
.canvas.empty{display:flex;align-items:center;justify-content:center}
.empty-inner{text-align:center}
.empty-title{font-size:15px;color:var(--term-fg);margin-bottom:16px}
.c-dim{color:var(--term-dim)}
.c-green{color:var(--term-green)}
.c-yellow{color:var(--term-yellow)}
.c-blue{color:var(--term-blue)}
.c-red{color:var(--term-red)}
.c-bold{font-weight:700}
.cursor{display:inline-block;width:1ch;height:1.4em;background:var(--term-cursor);vertical-align:text-bottom;animation:blink 1s step-end infinite}
.sk{display:flex;flex-direction:column;gap:10px;padding:8px}
.sk i{display:block;height:8px;border-radius:4px;background:rgba(250,249,245,.12);animation:pulse 1.2s ease-in-out infinite}
.bottombar{height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--surface);border-top:1px solid var(--border-muted)}
.paste{height:40px;min-width:64px;border:0;background:transparent;border-radius:10px;color:var(--primary-text);font:500 14px var(--sans);padding:0 8px;cursor:pointer}
.paste:active{background:var(--hover)}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.dot{width:6px;height:6px;border-radius:999px;background:var(--success);display:inline-block}
.dot.warn{background:var(--warning)}
.dot.err{background:var(--error)}

/* 覆盖层 */
.card-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .16s ease-out}
.ov-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 32px);max-width:360px;background:var(--surface);border-radius:14px;padding:20px;box-shadow:0 8px 24px rgba(15,31,24,.24);animation:rise .16s ease-out}
.ov-card h3{font-size:16px;line-height:24px;margin:0;font-weight:600}
.ov-card p{font-size:13px;line-height:20px;color:var(--text-2);margin:8px 0 16px}
.ov-actions{display:flex;flex-direction:column;gap:8px}
.full-ov{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.fo-inner{max-width:320px}
.full-ov h2{font-size:18px;line-height:26px;margin:0 0 8px;font-weight:600}
.full-ov p{font-size:14px;line-height:22px;color:var(--text-2);margin:0 0 20px}
.menu-scrim{position:absolute;inset:0;z-index:25;background:transparent}
.menu{position:absolute;top:56px;right:8px;z-index:30;width:180px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(15,31,24,.16);padding:4px 0;animation:pop .14s ease-out;transform-origin:top right}
.menu button{display:block;width:100%;height:48px;padding:0 16px;border:0;background:transparent;text-align:left;font:15px var(--sans);color:var(--text-1);cursor:pointer}
.menu button:active{background:var(--hover)}
.menu .sep{height:1px;background:var(--border-muted);margin:4px 0}
.menu .danger{color:var(--error-text)}
.dialog-scrim{position:absolute;inset:0;z-index:50;background:var(--scrim);animation:fade .16s ease-out}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:51;width:calc(100% - 32px);max-width:400px;max-height:60vh;overflow:auto;background:var(--surface);border-radius:14px;padding:20px;animation:rise .16s ease-out}
.dialog h3{font-size:16px;margin:0 0 4px;font-weight:600}
.dialog textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:10px;padding:10px;font:16px/22px var(--sans);resize:none;margin-top:12px;color:var(--text-1)}
.dialog .err-line{margin-top:6px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg-actions .btn{min-width:88px}
.device.kb .dialog{top:44%;max-height:52vh}

/* ===== 配置页 ===== */
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.topbar.simple{justify-content:flex-start;gap:2px;padding:0 4px}
.page-title{font-size:16px;font-weight:600;color:var(--text-1)}
.cfg-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px 32px;width:100%;max-width:560px;margin:0 auto}
.cfg-row{display:flex;align-items:center;min-height:56px;padding:12px 0;border-bottom:1px solid var(--border-muted);gap:12px;flex-wrap:wrap}
.cfg-row > label{width:88px;flex:0 0 88px;font-size:15px;color:var(--text-1)}
.cfg-ctl{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px}
select.inp,input.inp{height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font:15px var(--sans);color:var(--text-1);padding:0 10px;min-width:0;flex:1;max-width:320px}
input.inp::placeholder{color:var(--text-3)}
select.inp:disabled{opacity:.45}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;max-width:200px;height:4px;border-radius:999px;background:var(--border);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.range-val{font-size:15px;font-weight:600;width:28px;text-align:right;flex:0 0 28px}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;height:40px;flex:1;max-width:240px}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-2);cursor:pointer}
.seg span.on{background:var(--active);color:var(--primary-text);font-weight:600}
.clear-btn{height:44px;border:0;background:transparent;color:var(--primary-text);font:500 12px var(--sans);padding:0 4px;cursor:pointer}
.spin{width:12px;height:12px;flex:0 0 12px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:rot .8s linear infinite}
.save-txt{font-size:12px;color:var(--text-3);white-space:nowrap}
.err-inline{flex:0 0 100%;font-size:12px;color:var(--error-text);margin-top:2px;padding-left:100px}
.inp.bad{border-color:var(--error)}
.banner-sticky{position:sticky;top:0;z-index:2;margin:12px 0 0}

/* ===== 桌面专区（对照） ===== */
.desk-wrap{flex:1;min-height:0;overflow:auto;background:var(--bg);padding:40px}
.desk-card{max-width:920px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px}
.desk-card h2{font-size:19px;margin:0 0 8px;font-weight:600}
.desk-sub{font-size:13px;line-height:20px;color:var(--text-3);margin:0 0 20px}
.desk-row{display:flex;align-items:center;gap:12px;min-height:48px;flex-wrap:wrap}
.desk-row .dl{font-size:15px;color:var(--text-1);min-width:120px}
.desk-input{height:36px;border:1px solid var(--border);border-radius:10px;padding:0 10px;width:88px;font:14px var(--mono);color:var(--text-1)}
.desk-hint{font-size:12px;color:var(--text-3)}
.switch{width:44px;height:24px;border-radius:999px;background:var(--border);position:relative;flex:0 0 auto;display:inline-block}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--primary)}
.switch.on i{left:22px}
.sec-label{font-size:13px;font-weight:600;color:var(--text-2);margin:20px 0 8px}
.addr-row{display:flex;align-items:center;gap:8px;height:36px}
.addr-row code{font:13px var(--mono);color:var(--text-1)}
.chip{font-size:12px;background:var(--active);color:var(--primary-text);border-radius:999px;padding:2px 8px}
.desk-err{font-size:12px;color:var(--error-text);margin:2px 0 8px}
.warn-line{font-size:13px;color:var(--warning-text);margin-top:8px}
.bind{display:flex;gap:20px;align-items:flex-start;margin-top:12px}
.qr{width:160px;height:160px;border:1px solid var(--border);border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(17,1fr);grid-template-rows:repeat(17,1fr);gap:1px;background:#fff;flex:0 0 auto}
.qr i{background:transparent}
.qr i.b{background:#111}
.bind-side{flex:1;font-size:13px;line-height:22px;color:var(--text-2)}
.bind-side .mono{font:13px var(--mono);color:var(--text-1)}
.desk-muted{font-size:13px;color:var(--text-3);min-height:44px;display:flex;align-items:center}
.desk-actions{margin-top:16px;display:flex;gap:8px}

@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translate(-50%,calc(-50% + 8px))}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important;transition-duration:0s!important}}
</style>
</head>
<body>

<aside class="switcher">
  <div class="sw-title">网页终端 · UI demo</div>
  <div class="sw-badge">仅 demo：此切换器与下方三个模拟开关不属于产品界面；demo 仅设计验证，非产品实现。</div>
  <div class="sw-toggles">
    <label class="tg"><input type="checkbox" id="tg-land"> 横屏 667×375</label>
    <label class="tg"><input type="checkbox" id="tg-safe"> 刘海/手势安全区 47/34</label>
    <label class="tg"><input type="checkbox" id="tg-kb"> 键盘弹起（模拟 250）</label>
  </div>
  <div id="sw-list"></div>
</aside>

<main class="stage">
  <div class="device" id="device">
    <div class="safe-top">刘海安全区 47pt</div>
    <div class="screen-host">
      <div class="screen" id="screen"></div>
      <div class="fakekb">
        <div class="kbrow"><span>Q</span><span>W</span><span>E</span><span>R</span><span>T</span><span>Y</span><span>U</span><span>I</span><span>O</span><span>P</span></div>
        <div class="kbrow"><span>A</span><span>S</span><span>D</span><span>F</span><span>G</span><span>H</span><span>J</span><span>K</span><span>L</span></div>
        <div class="kbrow"><span>⇧</span><span>Z</span><span>X</span><span>C</span><span>V</span><span>B</span><span>N</span><span>M</span><span>⌫</span></div>
        <div class="kbrow wide"><span>123</span><span>空格</span><span>换行</span></div>
      </div>
    </div>
    <div class="safe-bottom">底部手势区 34pt</div>
  </div>
  <div class="stage-note" id="stage-note">仅设计验证，非产品实现</div>
</main>

<script>
'use strict';

/* ========== 通用片段 ========== */
function otp(o){
  o = o || {};
  const v = String(o.value || '');
  const cells = [];
  for(let i=0;i<6;i++){
    cells.push(`<span class="cell${o.focus===i?' focus':''}">${v[i] ? v[i] : ''}</span>`);
  }
  return `<div class="otp${o.disabled?' dis':''}${o.error?' err':''}" role="group" aria-label="六位验证码">${cells.join('')}</div>`;
}

function auth(o){
  return `<div class="auth"><div class="auth-card">
    <div class="brand"><i class="brand-dot"></i>DevDesk 网页终端</div>
    <h1>${o.title}</h1>
    ${o.sub ? `<p class="sub">${o.sub}</p>` : ''}
    ${o.body || ''}
  </div></div>`;
}

function bindBody(o){

function term(o){
  o = o || {};
  const tabs = o.tabs || ['终端 1'];
  const active = (o.active === undefined) ? 0 : o.active;
  const tabsHtml = tabs.map((t,i)=>{
    const on = i === active;
    return `<div class="tab${on?' on':''}">${t}${on?'<button class="tab-x" aria-label="关闭 '+t+'">×</button>':''}</div>`;
  }).join('');

  const top = `<header class="topbar">
    <div class="tabs">${tabsHtml}</div>
    <button class="iconbtn" aria-label="新建终端">+</button>
    <span class="vdiv"></span>
    <button class="iconbtn" aria-label="菜单">⋮</button>
  </header>`;

  const reconnect = o.reconnect ? `<div class="reconnect"><span>连接中断，正在重连（第 ${o.reconnect} 次）</span><button>重新连接</button></div>` : '';

  let canvas;
  if(o.skeleton){
    canvas = `<div class="canvas"><div class="sk">${[62,84,46,70,38,88,54,76,40,66,82,50].map(w=>`<i style="width:${w}%"></i>`).join('')}</div></div>`;
  } else if(o.empty){
    canvas = `<div class="canvas empty"><div class="empty-inner"><div class="empty-title">暂无终端</div><button class="btn primary">新建终端</button></div></div>`;
  } else {
    canvas = `<div class="canvas${o.selecting?' selecting':''}"><pre>${o.selecting ? SELECT_LINES : (o.wide ? WIDE_LINES : TERM_LINES)}</pre></div>`;
  }

  const wrap = `<div class="canvas-wrap">${canvas}${o.card ? sessionCard(o.card) : ''}</div>`;

  const bottom = `<footer class="bottombar">
    <button class="paste">粘贴</button>
    <div class="conn"><i class="dot ${o.dot||''}"></i>${o.status||'已连接'}</div>
  </footer>`;

  const menu = o.menu ? `<div class="menu-scrim"></div><div class="menu" role="menu">
      <button role="menuitem">配置</button><div class="sep"></div><button role="menuitem" class="danger">退出登录</button>
    </div>` : '';

  return `<div class="term">${top}${reconnect}${wrap}${bottom}${menu}</div>`;
}

/* ========== 桌面专区 ========== */
function qr(){
  let cells = '';
  for(let r=0;r<17;r++){
    for(let c=0;c<17;c++){
      const corner = (r<5&&c<5)||(r<5&&c>11)||(r>11&&c<5);
      let b;
      if(corner){
        const rr = r<5?r:r-12, cc = c<5?c:c-12;
        b = rr===0||rr===4||cc===0||cc===4||(rr===2&&cc===2);
      } else {
        b = ((r*7 + c*13 + (r*c)%5) % 3) === 0;
      }
      cells += `<i class="${b?'b':''}"></i>`;
    }
  }
  return `<div class="qr" role="img" aria-label="绑定二维码（占位图案）">${cells}</div>`;
}

  'desk-unbound': {g:'桌面专区（对照）', n:'未绑定', desk:true, html:()=>desk({on:true})},
  'desk-bound': {g:'桌面专区（对照）', n:'已绑定验证器', desk:true, html:()=>desk({on:true, bound:true})},
  'desk-port': {g:'桌面专区（对照）', n:'端口占用', desk:true, html:()=>desk({portErr:'端口 7878 被占用，请更换端口后重试'})},
  'desk-nolan': {g:'桌面专区（对照）', n:'无局域网', desk:true, html:()=>desk({on:true, nolan:true})}
};

const ORDER = [
  ['加密会话', ['handshake','handshake-fail']],
  ['绑定页（扫码后）', ['bind-valid','bind-submitting','bind-wrong','bind-dead','bind-expired','bind-used']],
  ['登录页', ['login-empty','login-submitting','login-wrong','login-locked','login-unbound']],
  ['终端主界面', ['term-loading','term-normal','term-multi','term-overflow','term-menu','term-empty','term-reconnect','term-closed','term-revoked','term-exit','term-failed','term-selecting']],
  ['配置页', ['cfg-normal','cfg-saving','cfg-failed','cfg-dir-missing','cfg-dir-file','cfg-dir-perm','cfg-independent-dark']],
  ['粘贴', ['paste-lan','paste-prefill','paste-fail']],
  ['资源上限', ['limit-sse','limit-handshake','limit-sessions','limit-ticket']],
  ['桌面「网页访问」专区（对照）', ['desk-unbound','desk-bound','desk-port','desk-nolan']]
];

/* ========== 渲染与交互 ========== */
const device = document.getElementById('device');
const screen = document.getElementById('screen');
const swList = document.getElementById('sw-list');
const note = document.getElementById('stage-note');
const tgLand = document.getElementById('tg-land');
const tgSafe = document.getElementById('tg-safe');
const tgKb = document.getElementById('tg-kb');
let current = 'term-normal';

ORDER.forEach(([group, ids])=>{
  const h = document.createElement('div');
  h.className = 'sw-group';
  h.textContent = group;
  swList.appendChild(h);
  ids.forEach(id=>{
    const b = document.createElement('button');
    b.className = 'sw-btn';
    b.dataset.id = id;
    b.innerHTML = `${SCREENS[id].n}<span>${id}</span>`;
    b.addEventListener('click', ()=>render(id));
    swList.appendChild(b);
  });
});

function applyToggles(){
  const isDesk = !!SCREENS[current].desk;
  device.classList.toggle('desk', isDesk);
  device.classList.toggle('land', !isDesk && tgLand.checked);
  device.classList.toggle('safe', !isDesk && tgSafe.checked);
  device.classList.toggle('kb', !isDesk && tgKb.checked);
  tgLand.disabled = isDesk;
  tgSafe.disabled = isDesk;
  tgKb.disabled = isDesk;
}

function render(id){
  current = id;
  const s = SCREENS[id];
  screen.innerHTML = s.html();
  document.querySelectorAll('.sw-btn').forEach(b=>b.classList.toggle('on', b.dataset.id === id));
  applyToggles();
  note.textContent = `仅设计验证，非产品实现 · 当前：${s.g} · ${s.n}`;
  if(location.hash !== '#' + id){ history.replaceState(null, '', '#' + id); }
  // 页签溢出时把激活页签滚入视野
  const on = screen.querySelector('.tab.on');
  if(on && typeof on.scrollIntoView === 'function'){ on.scrollIntoView({inline:'nearest', block:'nearest'}); }
}

tgLand.addEventListener('change', applyToggles);
tgSafe.addEventListener('change', applyToggles);
tgKb.addEventListener('change', applyToggles);

// 终端屏点击页签可切换（仅演示即时反馈，不改变共享状态）
screen.addEventListener('click', e=>{
  const tab = e.target.closest('.tab');
  if(tab && !device.classList.contains('desk')){
    const parent = tab.parentElement;
    parent.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
    tab.classList.add('on');
  }
});

const params = new URLSearchParams(location.search);
if(params.get('land') === '1') tgLand.checked = true;
if(params.get('safe') === '1') tgSafe.checked = true;
if(params.get('kb') === '1') tgKb.checked = true;

const initial = location.hash.replace('#','');
render(SCREENS[initial] ? initial : 'term-normal');
window.addEventListener('hashchange', ()=>{
  const h = location.hash.replace('#','');
  if(SCREENS[h] && h !== current){ render(h); }
});
</script>
</body>
</html>
