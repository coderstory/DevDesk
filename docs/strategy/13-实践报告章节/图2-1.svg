<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .box { fill: none; stroke: #2c3e50; stroke-width: 1.8; }
    .box-fill-layer1 { fill: #f8f9fa; stroke: #2c3e50; stroke-width: 1.8; }
    .box-fill-layer2 { fill: #eef1f5; stroke: #2c3e50; stroke-width: 1.8; }
    .box-fill-layer3 { fill: #e3e8ee; stroke: #2c3e50; stroke-width: 1.8; }
    .box-fill-layer4 { fill: #d8dee6; stroke: #2c3e50; stroke-width: 1.8; }
    .layer-title { font-size: 14px; font-weight: bold; fill: #1a1a2e; }
    .layer-desc { font-size: 12px; fill: #4a5568; }
    .component { font-size: 12px; fill: #2d3748; }
    .arrow { stroke: #1e40af; stroke-width: 1.6; fill: none; marker-end: url(#arrowhead); }
    .rule-text { font-size: 12px; fill: #64748b; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e40af" />
    </marker>
  </defs>

  <!-- Layer 1: Business Modules (7 modules, 2 rows) -->
  <rect x="40" y="20" width="400" height="118" rx="6" class="box-fill-layer1" />
  <text x="240" y="44" text-anchor="middle" class="layer-title">业务模块层（7 个 Router 页面）</text>
  <text x="240" y="62" text-anchor="middle" class="layer-desc">用户可见的功能入口，模块间禁止互相依赖</text>

  <!-- Row 1 -->
  <rect x="50" y="76" width="88" height="24" rx="3" class="box" />
  <text x="94" y="93" text-anchor="middle" class="component">首页</text>
  <rect x="144" y="76" width="88" height="24" rx="3" class="box" />
  <text x="188" y="93" text-anchor="middle" class="component">笔记本</text>
  <rect x="238" y="76" width="88" height="24" rx="3" class="box" />
  <text x="282" y="93" text-anchor="middle" class="component">待办</text>
  <rect x="332" y="76" width="88" height="24" rx="3" class="box" />
  <text x="376" y="93" text-anchor="middle" class="component">Claude</text>
  <!-- Row 2 -->
  <rect x="96" y="106" width="88" height="24" rx="3" class="box" />
  <text x="140" y="123" text-anchor="middle" class="component">智能体</text>
  <rect x="196" y="106" width="88" height="24" rx="3" class="box" />
  <text x="240" y="123" text-anchor="middle" class="component">设置</text>
  <rect x="296" y="106" width="88" height="24" rx="3" class="box" />
  <text x="340" y="123" text-anchor="middle" class="component">关于</text>

  <!-- Arrow L1→L2 -->
  <line x1="240" y1="138" x2="240" y2="166" class="arrow" />
  <text x="258" y="153" class="rule-text">依赖方向（只能上层依赖下层）</text>

  <!-- Layer 2: Core (4 components, 2 rows) -->
  <rect x="40" y="168" width="400" height="100" rx="6" class="box-fill-layer2" />
  <text x="240" y="192" text-anchor="middle" class="layer-title">核心层 core</text>
  <text x="240" y="208" text-anchor="middle" class="layer-desc">公共基础设施，不依赖上层和 GUI 框架</text>

  <rect x="70" y="218" width="160" height="24" rx="3" class="box" />
  <text x="150" y="235" text-anchor="middle" class="component">通用错误处理</text>
  <rect x="250" y="218" width="160" height="24" rx="3" class="box" />
  <text x="330" y="235" text-anchor="middle" class="component">数据库管理与迁移</text>
  <rect x="70" y="246" width="160" height="24" rx="3" class="box" />
  <text x="150" y="263" text-anchor="middle" class="component">跨平台路径解析</text>
  <rect x="250" y="246" width="160" height="24" rx="3" class="box" />
  <text x="330" y="263" text-anchor="middle" class="component">页面路由与主题</text>

  <!-- Arrow L2→L3 -->
  <line x1="240" y1="268" x2="240" y2="296" class="arrow" />
  <text x="258" y="283" class="rule-text">依赖方向（只能上层依赖下层）</text>

  <!-- Layer 3: Platform (4 components, 2 rows) -->
  <rect x="40" y="298" width="400" height="100" rx="6" class="box-fill-layer3" />
  <text x="240" y="322" text-anchor="middle" class="layer-title">平台层 platform</text>
  <text x="240" y="338" text-anchor="middle" class="layer-desc">操作系统能力封装，跨平台统一接口</text>

  <rect x="70" y="348" width="160" height="24" rx="3" class="box" />
  <text x="150" y="365" text-anchor="middle" class="component">HTTP 网络请求</text>
  <rect x="250" y="348" width="160" height="24" rx="3" class="box" />
  <text x="330" y="365" text-anchor="middle" class="component">HTTP 本地代理</text>
  <rect x="70" y="376" width="160" height="24" rx="3" class="box" />
  <text x="150" y="393" text-anchor="middle" class="component">凭据安全存储</text>
  <rect x="250" y="376" width="160" height="24" rx="3" class="box" />
  <text x="330" y="393" text-anchor="middle" class="component">JSON 数据处理</text>

  <!-- Arrow L3→L4 -->
  <line x1="240" y1="398" x2="240" y2="426" class="arrow" />
  <text x="258" y="413" class="rule-text">依赖方向（只能上层依赖下层）</text>

  <!-- Layer 4: EUI-NEO -->
  <rect x="40" y="428" width="400" height="82" rx="6" class="box-fill-layer4" />
  <text x="240" y="452" text-anchor="middle" class="layer-title">GUI 框架 EUI-NEO</text>
  <text x="240" y="468" text-anchor="middle" class="layer-desc">跨平台原生渲染（OpenGL），约 50 种 UI 组件</text>

  <rect x="58" y="478" width="120" height="22" rx="3" class="box" />
  <text x="118" y="494" text-anchor="middle" class="component">窗口 · 字体 · DPI</text>
  <rect x="188" y="478" width="104" height="22" rx="3" class="box" />
  <text x="240" y="494" text-anchor="middle" class="component">控件 · 图表</text>
  <rect x="302" y="478" width="120" height="22" rx="3" class="box" />
  <text x="362" y="494" text-anchor="middle" class="component">动画 · 事件</text>
</svg>