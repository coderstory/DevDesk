  </defs>

  <!-- 标题 -->
  <text x="250" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#000">图 8-1：从零起步最小路线图</text>
  <text x="250" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">按依赖关系递进，标注事故触发条件</text>

