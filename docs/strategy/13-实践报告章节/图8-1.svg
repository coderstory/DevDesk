  <text x="92" y="524" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#777">12. 编译缓存 ccache</text>

  <line x1="160" y1="520" x2="183" y2="520" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="185" y="509" width="135" height="22" rx="4" fill="#fff" stroke="#aaa" stroke-width="1"/>
  <text x="252" y="524" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#777">13. 构建脚本封装</text>

  <line x1="320" y1="520" x2="343" y2="520" stroke="#aaa" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="345" y="509" width="135" height="22" rx="4" fill="#fff" stroke="#aaa" stroke-width="1"/>
  <text x="412" y="524" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#777">14. 真窗口探针</text>

  <!-- 分隔线 -->
