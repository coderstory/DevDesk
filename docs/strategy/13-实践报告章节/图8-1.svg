  <text x="25" y="399" font-family="sans-serif" font-size="13" font-weight="bold" fill="#555">路径二：推荐机制（有更好，没有也能跑）</text>

  <rect x="25" y="410" width="135" height="22" rx="4" fill="#fff" stroke="#777" stroke-width="1.2"/>
