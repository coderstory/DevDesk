  <text x="332" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">11. 交付前三问</text>

  <!-- 分隔线 -->
  <line x1="25" y1="477" x2="475" y2="477" stroke="#ccc" stroke-width="0.8" stroke-dasharray="6,3"/>

