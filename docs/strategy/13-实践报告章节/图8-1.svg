  <rect x="185" y="410" width="135" height="22" rx="4" fill="#fff" stroke="#777" stroke-width="1.2"/>
  <text x="252" y="425" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">8. 自动复盘</text>

