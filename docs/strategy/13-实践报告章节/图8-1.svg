  <!-- 触发条件速查 -->
  <text x="25" y="566" font-family="sans-serif" font-size="12" font-weight="bold" fill="#000">触发条件速查 — 事故类型及其该补的机制</text>

  <text x="25" y="586" font-family="sans-serif" font-size="12" fill="#444">AI 顺手改了不该改的</text>
  <text x="280" y="586" font-family="sans-serif" font-size="12" fill="#888">— 补 1 中的镜像复述纪律</text>

  <text x="25" y="604" font-family="sans-serif" font-size="12" fill="#444">测试全绿但真机一上手就炸</text>
  <text x="280" y="604" font-family="sans-serif" font-size="12" fill="#888">— 补 11 交付前三问</text>

  <text x="25" y="622" font-family="sans-serif" font-size="12" fill="#444">多子任务同文件合并冲突</text>
  <text x="280" y="622" font-family="sans-serif" font-size="12" fill="#888">— 补 1 中的同文件互斥规则</text>

  <text x="25" y="640" font-family="sans-serif" font-size="12" fill="#444">规则写了但 AI 不遵守</text>
  <text x="280" y="640" font-family="sans-serif" font-size="12" fill="#888">— 补 6 流程强制层 hooks</text>

  <text x="25" y="658" font-family="sans-serif" font-size="12" fill="#444">隔周不记得上次的教训</text>
  <text x="280" y="658" font-family="sans-serif" font-size="12" fill="#888">— 补 5 经验沉淀闭环</text>

  <text x="25" y="676" font-family="sans-serif" font-size="12" fill="#444">无人值守子任务悄悄卡死</text>
  <text x="280" y="676" font-family="sans-serif" font-size="12" fill="#888">— 补 10 无人值守 watchdog</text>

