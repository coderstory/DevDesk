  <text x="250" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a3a5c">启用 worktree 隔离</text>

  <line x1="250" y1="204" x2="250" y2="224" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

