<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a3a5c"/>
    </marker>
  </defs>

  <!-- 图标题 -->
  <text x="250" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">图 1-1：不可能的三角与七轴机制</text>

  <!-- ===== 不可能三角：三个顶点 ===== -->

  <!-- 顶点一：C++20 大型项目（上） -->
  <rect x="175" y="38" width="150" height="38" rx="4" fill="#f5f5f5" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="250" y="62" text-anchor="middle" font-size="13" fill="#333" font-family="sans-serif">C++20 大型项目</text>

  <!-- 顶点二：用户不熟 C++（左下） -->
  <rect x="15" y="123" width="140" height="38" rx="4" fill="#f5f5f5" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="85" y="147" text-anchor="middle" font-size="13" fill="#333" font-family="sans-serif">用户不熟 C++</text>

  <!-- 顶点三：六模块全功能交付（右下） -->
  <rect x="345" y="123" width="140" height="38" rx="4" fill="#f5f5f5" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="415" y="147" text-anchor="middle" font-size="13" fill="#333" font-family="sans-serif">六模块全功能交付</text>

  <!-- 三角连线（虚线，表示三个条件互相制约） -->
  <line x1="250" y1="76" x2="85" y2="123" stroke="#1a3a5c" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="250" y1="76" x2="415" y2="123" stroke="#1a3a5c" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="115" y1="142" x2="385" y2="142" stroke="#1a3a5c" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- "不可能"标注文字 -->
  <text x="250" y="105" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">（看似互斥的三个条件）</text>

  <!-- ===== 汇聚线：三个顶点汇聚到中心支柱 ===== -->
  <line x1="250" y1="76" x2="250" y2="218" stroke="#1a3a5c" stroke-width="1.5"/>
  <line x1="85" y1="161" x2="250" y2="218" stroke="#888" stroke-width="1"/>
  <line x1="415" y1="161" x2="250" y2="218" stroke="#888" stroke-width="1"/>

  <!-- ===== 中心支柱节点 ===== -->
  <rect x="132" y="218" width="236" height="56" rx="28" fill="#1a3a5c"/>
  <text x="250" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="sans-serif">靠机制而非</text>
  <text x="250" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="sans-serif">人的记性</text>

  <!-- ===== 七根辐射箭头：七章对应的机制轴 ===== -->

  <!-- 预防（第5章） -->
  <line x1="250" y1="274" x2="107" y2="340" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="95" y="343" text-anchor="end" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">预防</text>
  <text x="95" y="362" text-anchor="end" font-size="12" fill="#777" font-family="sans-serif">第5章</text>

  <!-- 复盘（第6章） -->
  <line x1="250" y1="274" x2="148" y2="380" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="136" y="383" text-anchor="end" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">复盘</text>
  <text x="136" y="402" text-anchor="end" font-size="12" fill="#777" font-family="sans-serif">第6章</text>

  <!-- 监控（第7章） -->
  <line x1="250" y1="274" x2="196" y2="408" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="184" y="411" text-anchor="end" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">监控</text>
  <text x="184" y="430" text-anchor="end" font-size="12" fill="#777" font-family="sans-serif">第7章</text>

  <!-- 编排（第3·4章，居中直下） -->
  <line x1="250" y1="274" x2="250" y2="440" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">编排</text>
  <text x="250" y="475" text-anchor="middle" font-size="12" fill="#777" font-family="sans-serif">第3·4章</text>

  <!-- 隔离（第5章） -->
  <line x1="250" y1="274" x2="304" y2="408" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="316" y="411" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">隔离</text>
  <text x="316" y="430" text-anchor="start" font-size="12" fill="#777" font-family="sans-serif">第5章</text>

  <!-- 验证（第4章） -->
  <line x1="250" y1="274" x2="352" y2="380" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="364" y="383" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">验证</text>
  <text x="364" y="402" text-anchor="start" font-size="12" fill="#777" font-family="sans-serif">第4章</text>

  <!-- 审计（第7章） -->
  <line x1="250" y1="274" x2="393" y2="340" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="343" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">审计</text>
  <text x="405" y="362" text-anchor="start" font-size="12" fill="#777" font-family="sans-serif">第7章</text>

</svg>