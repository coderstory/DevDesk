<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="100%" max-width="170mm">
  <defs>
    <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#2c3e50" stroke="none"/>
    </marker>
    <marker id="arrowDown2" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0" fill="#2c3e50" stroke="none"/>
    </marker>
  </defs>

  <rect width="520" height="620" fill="#ffffff"/>

  <text x="260" y="26" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="15" fill="#2c3e50" font-weight="bold">图 7-2 PDCA 多轮递升审计流程</text>

  <!-- Legend -->
  <rect x="20" y="38" width="480" height="26" rx="3" fill="#f8f9fa" stroke="#dee2e6" stroke-width="0.8"/>
  <rect x="36" y="46" width="14" height="10" rx="2" fill="#2980b9"/>
  <text x="55" y="55" font-family="SimSun, sans-serif" font-size="12.5" fill="#555">审计</text>
  <rect x="96" y="46" width="14" height="10" rx="2" fill="#e74c3c"/>
  <text x="115" y="55" font-family="SimSun, sans-serif" font-size="12.5" fill="#555">发现问题</text>
  <rect x="190" y="46" width="14" height="10" rx="2" fill="#27ae60"/>
  <text x="209" y="55" font-family="SimSun, sans-serif" font-size="12.5" fill="#555">修复</text>
  <rect x="250" y="46" width="14" height="10" rx="2" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <text x="269" y="55" font-family="SimSun, sans-serif" font-size="12.5" fill="#555">无新发现</text>
  <rect x="350" y="46" width="14" height="10" rx="2" fill="#2c3e50"/>
  <text x="369" y="55" font-family="SimSun, sans-serif" font-size="12.5" fill="#555">通过</text>

  <!-- ===== Round 1 ===== -->
  <rect x="20" y="78" width="480" height="22" rx="3" fill="#2980b9"/>
  <text x="260" y="93" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold">第一轮审计——范围：核心路径与关键逻辑</text>

  <rect x="40" y="104" width="440" height="16" rx="2" fill="#d6eaf8"/>
  <text x="260" y="116" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#2c3e50">审查维度：正确性（对照需求）、测试有效性、回归面（核心调用链）</text>

  <!-- Round 1 boxes -->
  <rect x="45" y="128" width="130" height="32" rx="5" fill="#2980b9"/>
  <text x="110" y="144" text-anchor="middle" font-family="SimHei, sans-serif" font-size="12.5" fill="#ffffff">审计员 A（只读）</text>
  <text x="110" y="156" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#d6eaf8">独立会话，非实现者</text>

  <line x1="180" y1="144" x2="205" y2="144" stroke="#2c3e50" stroke-width="1.2" marker-end="url(#arrowRight)"/>

  <rect x="210" y="128" width="130" height="32" rx="5" fill="#e74c3c"/>
  <text x="275" y="144" text-anchor="middle" font-family="SimHei, sans-serif" font-size="12.5" fill="#ffffff">发现 N₁ 条问题</text>
  <text x="275" y="156" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#fadbd8">位置 + 影响 + 建议</text>

  <line x1="275" y1="162" x2="275" y2="180" stroke="#2c3e50" stroke-width="1.2" marker-end="url(#arrowDown2)"/>

  <rect x="210" y="182" width="130" height="24" rx="5" fill="#27ae60"/>
  <text x="275" y="198" text-anchor="middle" font-family="SimHei, sans-serif" font-size="12.5" fill="#ffffff">逐条修复</text>

  <line x1="275" y1="208" x2="275" y2="228" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDown2)"/>

  <!-- ===== Round 2 ===== -->
  <rect x="20" y="232" width="480" height="22" rx="3" fill="#e67e22"/>
  <text x="260" y="247" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold">第二轮审计——范围扩大：边界条件 + 异常路径 + 平台对称性</text>

  <rect x="20" y="258" width="480" height="32" rx="2" fill="#fdebd0"/>
  <text x="260" y="274" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#2c3e50">新增：平台对称性（双平台路径）、静默失败面（错误是否留日志）、回归面（全量调用链）</text>
  <text x="260" y="288" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#7f8c8d">保留：正确性（复查上轮修复有无引入新问题）、测试有效性</text>

  <rect x="45" y="298" width="130" height="32" rx="5" fill="#e67e22"/>
  <text x="110" y="314" text-anchor="middle" font-family="SimHei, sans-serif" font-size="12.5" fill="#ffffff">审计员 B（只读）</text>
  <text x="110" y="326" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#fdebd0">≠ A ≠ 实现者</text>

  <line x1="180" y1="314" x2="195" y2="314" stroke="#2c3e50" stroke-width="1.2" marker-end="url(#arrowRight)"/>

  <rect x="205" y="294" width="120" height="20" rx="5" fill="#e74c3c"/>
  <text x="265" y="308" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#ffffff">发现 N₂ 条 → 修</text>

  <rect x="340" y="294" width="120" height="20" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <text x="400" y="308" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#555">无新发现 → 待定</text>

  <line x1="265" y1="316" x2="265" y2="326" stroke="#2c3e50" stroke-width="1"/>
  <rect x="205" y="328" width="120" height="20" rx="5" fill="#27ae60"/>
  <text x="265" y="342" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#ffffff">逐条修复</text>

  <line x1="265" y1="352" x2="265" y2="368" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDown2)"/>

  <!-- ===== Round 3 ===== -->
  <rect x="20" y="372" width="480" height="22" rx="3" fill="#8e44ad"/>
  <text x="260" y="387" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold">第三轮审计——范围再扩大：跨模块影响 + 文档口径 + 全维复盘</text>

  <rect x="8" y="398" width="504" height="32" rx="2" fill="#f4ecf7"/>
  <text x="260" y="413" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#2c3e50">新增：文档口径（文案/字段名/截图与代码一致）、跨模块消费方普查、全量回归面</text>
  <text x="260" y="427" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#7f8c8d">六维度全开，保留前两轮全部维度</text>

  <rect x="45" y="438" width="130" height="32" rx="5" fill="#8e44ad"/>
  <text x="110" y="454" text-anchor="middle" font-family="SimHei, sans-serif" font-size="12.5" fill="#ffffff">审计员 C（只读）</text>
  <text x="110" y="466" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#e8daef">≠ A/B ≠ 实现者</text>

  <line x1="180" y1="454" x2="195" y2="454" stroke="#2c3e50" stroke-width="1.2" marker-end="url(#arrowRight)"/>

  <rect x="205" y="434" width="120" height="20" rx="5" fill="#e74c3c"/>
  <text x="265" y="448" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#ffffff">发现 N₃ 条 → 修</text>

  <rect x="340" y="434" width="120" height="20" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <text x="400" y="448" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#555">无新发现 → 待定</text>

  <line x1="265" y1="456" x2="265" y2="466" stroke="#2c3e50" stroke-width="1"/>
  <rect x="205" y="468" width="120" height="20" rx="5" fill="#27ae60"/>
  <text x="265" y="482" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#ffffff">逐条修复或裁定不修</text>

  <!-- Continuation -->
  <text x="260" y="505" text-anchor="middle" font-family="SimSun, sans-serif" font-size="18" fill="#999">···</text>
  <text x="260" y="516" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#999">若仍有新发现，继续递升第四轮、第五轮</text>

  <!-- Pass gate -->
  <rect x="110" y="530" width="300" height="36" rx="6" fill="#2c3e50"/>
  <text x="260" y="553" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="13" fill="#ecf0f1" font-weight="bold">连续 N 轮无新问题 → 审计通过</text>

  <text x="260" y="608" text-anchor="middle" font-family="SimSun, sans-serif" font-size="12.5" fill="#999">图注：每轮独立审计员（A/B/C），范围逐轮递升，连续 N 轮无新发现才放行</text>
<text x="260" y="612" text-anchor="middle" font-family="SimSun,sans-serif" font-size="12.5" fill="#999">图注：本图采用功能配色区分三个审计角色（A蓝/B橙/C紫）及状态节点，非装饰用途。</text>
</svg>