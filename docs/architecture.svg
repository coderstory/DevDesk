<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="DevDesk 架构">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9C1B5"/>
    </marker>
  </defs>

  <rect width="880" height="520" fill="#FAF8F4" rx="16"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">

    <!-- main -->
    <rect x="395" y="28" width="90" height="38" rx="19" fill="#D97757"/>
    <text x="440" y="53" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">main</text>

    <!-- arrow main -> modules -->
    <line x1="440" y1="66" x2="440" y2="96" stroke="#C9C1B5" stroke-width="1.6" marker-end="url(#arw)"/>

    <!-- modules band -->
    <rect x="40" y="100" width="800" height="112" rx="14" fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="60" y="128" font-size="13" font-weight="700" fill="#8A8177" letter-spacing="0.5">modules</text>
    <text x="134" y="128" font-size="12" fill="#A79E92">六个独立静态库，互不依赖</text>

    <g font-size="13.5" fill="#4A4A4A">
      <rect x="83" y="144" width="108" height="42" rx="9" fill="#F5F2EC" stroke="#DDD6CA"/>
      <text x="137" y="171" text-anchor="middle">home</text>
      <rect x="204" y="144" width="108" height="42" rx="9" fill="#F5F2EC" stroke="#DDD6CA"/>
      <text x="258" y="171" text-anchor="middle">markdown</text>
      <rect x="325" y="144" width="108" height="42" rx="9" fill="#F5F2EC" stroke="#DDD6CA"/>
      <text x="379" y="171" text-anchor="middle">todo</text>
      <rect x="446" y="144" width="108" height="42" rx="9" fill="#F5F2EC" stroke="#DDD6CA"/>
      <text x="500" y="171" text-anchor="middle">claude_proxy</text>
      <rect x="567" y="144" width="108" height="42" rx="9" fill="#F5F2EC" stroke="#DDD6CA"/>
      <text x="621" y="171" text-anchor="middle">settings</text>
      <rect x="688" y="144" width="108" height="42" rx="9" fill="#F5F2EC" stroke="#DDD6CA"/>
      <text x="742" y="171" text-anchor="middle">pet</text>
    </g>

    <!-- arrow modules -> core -->
    <line x1="440" y1="212" x2="440" y2="242" stroke="#C9C1B5" stroke-width="1.6" marker-end="url(#arw)"/>

    <!-- core -->
    <rect x="40" y="246" width="800" height="62" rx="12" fill="#F5F2EC" stroke="#D9D2C7" stroke-width="1.4"/>
    <text x="62" y="272" font-size="15" font-weight="700" fill="#2B2B2B">core</text>
    <text x="62" y="292" font-size="12.5" fill="#7C7367">Result · SqliteDb · Router · Theme · Logging　—　不依赖 platform，也不调用 GUI 框架运行时</text>

    <line x1="440" y1="308" x2="440" y2="338" stroke="#C9C1B5" stroke-width="1.6" marker-end="url(#arw)"/>

    <!-- platform -->
    <rect x="40" y="342" width="800" height="62" rx="12" fill="#F5F2EC" stroke="#D9D2C7" stroke-width="1.4"/>
    <text x="62" y="368" font-size="15" font-weight="700" fill="#2B2B2B">platform</text>
    <text x="62" y="388" font-size="12.5" fill="#7C7367">HttpClient · HttpServer · Keychain · Json　—　平台实现按 *_macos / *_win / *_posix 拆文件</text>

    <line x1="440" y1="404" x2="440" y2="434" stroke="#C9C1B5" stroke-width="1.6" marker-end="url(#arw)"/>

    <!-- EUI-NEO -->
    <rect x="40" y="438" width="800" height="62" rx="12" fill="#FDF1EC" stroke="#E8C4B4" stroke-width="1.4"/>
    <text x="62" y="464" font-size="15" font-weight="700" fill="#2B2B2B">EUI-NEO</text>
    <text x="140" y="464" font-size="12" fill="#B4725A">（修改版 fork）</text>
    <text x="62" y="484" font-size="12.5" fill="#8A6A5C">OpenGL / Vulkan × GLFW / SDL2</text>

  </g>
</svg>
